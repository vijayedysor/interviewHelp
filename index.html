<header><div class="w"><h1>React Native interview prep</h1>

<footer>Say it in your own words. Only claim what you have done.</footer>
<script>
var S=[
{id:"pitch",n:"Pitch",lead:"Your story, matched to Tripare.",q:[
["Tell me about yourself",`<p class="say">I’m Vijay, a React and React Native engineer with 6+ years across aviation, fintech and media. At IndiGo I built a Shell App and Mini Apps setup with Module Federation so teams deploy independently, and I shipped the in-flight entertainment feature “Hello 6E”, validated on live flights. Earlier I cut page load time by 60% at Taj Games. I like owning a feature from requirement to release, which is how Tripare describes this role. I can join within a month.</p><p><span class="tag">Check</span>Your notes say “60% and reduced crash rates”. Your CV ties the 60% to load time at Taj Games. Say that, and only mention crash numbers you can back up.</p>`],
["Gap since April 2026",`<p class="say">I took a planned break for family caregiving during a pregnancy and early childcare. That has settled, I’m ready to work full time and can join within a month.</p>`],
["Why you left Taj Games and Conneqt",`<p>GridLogic reduced the team after the 28% GST on real-money gaming hit revenue. Conneqt’s engagement ended when the project completed. Both are factual, say them once.</p>`],
["6+ years but the role says 3–5",`<p class="say">I want a product team where I own features end to end. My extra experience means I work independently, review code and help with architecture.</p>`],
["Where you are strong vs where to prepare",`<div class="tw"><table><tr><th>Tripare asks</th><th>Your evidence</th><th>Status</th></tr><tr><td>React Native, TS, REST</td><td>IndiGo, MarketBrief, Taj Games</td><td>Strong</td></tr><tr><td>Performance, debugging</td><td>60% load gain, RN upgrades</td><td>Strong</td></tr><tr><td>Expo</td><td>Expo and EAS on CV</td><td>Strong</td></tr><tr><td>Store releases, Fastlane</td><td>Jenkins, GitHub Actions, OTA. Store steps not on CV</td><td>Prepare</td></tr><tr><td>Push, deep linking</td><td>Not on CV</td><td>Prepare</td></tr></table></div>`]]},

{id:"core",n:"React Native",lead:"FlatList, hooks, state, folder structure.",q:[
["FlatList: how it works and a full example",`<p>FlatList is virtualised: it renders only items near the viewport and recycles the rest, so memory stays flat.</p><pre>const Row = React.memo(({ item, onPress }: Props) =&gt; (
  &lt;Pressable onPress={() =&gt; onPress(item.id)}&gt;
    &lt;Text&gt;{item.name}&lt;/Text&gt;
  &lt;/Pressable&gt;
));

export default function Users({ data }: { data: User[] }) {
  const [q, setQ] = useState("");
  const list = useMemo(() =&gt;
    data.filter(u =&gt; u.name.toLowerCase().includes(q.toLowerCase())), [data, q]);
  const onPress = useCallback((id: string) =&gt; nav.navigate("User", { id }), []);
  const render = useCallback(({ item }) =&gt; &lt;Row item={item} onPress={onPress} /&gt;, [onPress]);

  return (
    &lt;FlatList
      data={list}
      renderItem={render}
      keyExtractor={u =&gt; u.id}
      getItemLayout={(_, i) =&gt; ({ length: 56, offset: 56 * i, index: i })}
      initialNumToRender={10}
      windowSize={7}
      removeClippedSubviews
      onEndReached={loadMore}
      onEndReachedThreshold={0.5}
      ListEmptyComponent={&lt;Text&gt;No users found.&lt;/Text&gt;}
    /&gt;
  );
}</pre><ul><li>Never use <code>ScrollView</code> + map for long data.</li><li>Stable keys, memoised rows, no inline arrow functions in <code>renderItem</code>.</li><li><code>getItemLayout</code> only for fixed-height rows. FlashList is the faster option for huge lists.</li><li>Your machine-coding task (search + active toggle) is the same <code>useMemo</code> filter pattern above.</li></ul>`],
["Hooks you should explain, and when to use useCallback",`<ul><li><b>useState / useReducer:</b> local state; reducer for multi-field or complex transitions.</li><li><b>useEffect:</b> side effects. Return cleanup for timers, listeners, subscriptions. Dependency array must be complete.</li><li><b>useRef:</b> mutable value that does not re-render; refs to components; store interval ids.</li><li><b>useMemo:</b> cache an expensive derived value.</li><li><b>useCallback:</b> keep a function reference stable when passing it to memoised children or effect dependencies. Not needed everywhere; it has its own cost.</li><li><b>useLayoutEffect, useContext, useTransition:</b> measure layout before paint; read context; mark low-priority updates.</li><li><b>Custom hooks:</b> reuse logic (<code>useDebounce</code>, <code>useNetworkStatus</code>, <code>useAuth</code>) so screens stay thin.</li></ul>`],
["Stopwatch with hooks (asked in your notes)",`<pre>function Stopwatch() {
  const [s, setS] = useState(0);
  const [on, setOn] = useState(false);
  useEffect(() =&gt; {
    if (!on) return;
    const id = setInterval(() =&gt; setS(v =&gt; v + 1), 1000);
    return () =&gt; clearInterval(id);
  }, [on]);
  return (&lt;&gt;
    &lt;Text&gt;{s}s&lt;/Text&gt;
    &lt;Button title={on ? "Pause" : "Start"} onPress={() =&gt; setOn(!on)} /&gt;
    &lt;Button title="Reset" onPress={() =&gt; { setOn(false); setS(0); }} /&gt;
  &lt;/&gt;);
}</pre><p>Point out: functional update <code>v =&gt; v + 1</code> avoids stale state; cleanup prevents leaked intervals.</p>`],
["State management: how to choose",`<ul><li><b>Local state</b> first. Lift only when two components need it.</li><li><b>Context:</b> low-change values (theme, auth session). Re-renders all consumers.</li><li><b>Zustand:</b> small global store, selectors avoid extra renders.</li><li><b>Redux Toolkit:</b> large teams, complex flows, middleware (Saga for effects like <code>call</code>, <code>put</code>, <code>takeLatest</code>), devtools.</li><li><b>Server state</b> (trips, bookings): React Query or similar cache, not a global store.</li></ul><p class="say">“I separate UI state, global client state and server state, and pick the lightest tool for each.”</p>`],
["Folder structure and architecture",`<pre>src/
  app/            navigation, providers, app entry
  features/
    auth/         screens, components, hooks, api, types
    bookings/
    expenses/
  shared/
    components/   Button, Input, List (reusable, typed)
    hooks/  utils/  theme/  api/ (axios client)
  native/         native module wrappers
  config/         env, constants, remote config</pre><ul><li>Feature folders keep ownership clear; shared code has no feature imports.</li><li>Screens are thin; logic in hooks; API calls in one typed client with interceptors.</li><li>Path aliases, strict TS, ESLint + Prettier, absolute imports.</li><li>Proof: Shell + Mini Apps at IndiGo forced clean boundaries between teams.</li></ul>`],
["Pure components and reconciliation",`<ul><li><b>PureComponent / React.memo:</b> skips re-render when props are shallow equal. Useless if you pass new object or function props each render.</li><li><b>Reconciliation:</b> React diffs the new element tree against the old one. Different type means remount. Same type updates in place. Keys identify list items.</li><li><b>HOC:</b> function that takes a component and returns an enhanced one. Hooks have mostly replaced it.</li></ul>`]]},

{id:"arch",n:"Architecture",lead:"Old vs new, native modules, Metro, Hermes.",q:[
["Old vs New Architecture",`<div class="tw"><table><tr><th>Old</th><th>New</th></tr><tr><td>Async Bridge, JSON serialisation</td><td>JSI, direct JS to native calls</td></tr><tr><td>Native Modules, loaded at startup</td><td>TurboModules, lazy and typed</td></tr><tr><td>Legacy UI Manager</td><td>Fabric renderer, concurrent features</td></tr><tr><td>Bottleneck in gestures, scroll, animation</td><td>Lower overhead, better startup</td></tr></table></div><p class="say">“The main difference is that the old architecture uses the Bridge, while the new one uses JSI with TurboModules and Fabric, removing the Bridge and improving performance, startup and responsiveness.”</p><p>If asked “Have you used it?” say what is true: you handled React Native upgrades at IndiGo, checked third-party library compatibility and verified features after migration.</p>`],
["How do you build a native module?",`<p><b>TS Spec → Codegen → TurboModule → Kotlin/Swift → Native API → Promise/Event → JS</b></p><ol><li>Define the JS API as a TypeScript TurboModule spec.</li><li>Codegen generates native interfaces.</li><li>Implement in Kotlin (Android) and Swift/Objective-C (iOS).</li><li>Register the module. JS calls it through <code>TurboModuleRegistry</code>.</li><li>Async results return as Promises; continuous updates as events.</li></ol><p>You built a custom native library for scoped storage at Vcraft, so mention it.</p>`],
["What is Metro?",`<p>Metro is React Native’s default JS bundler. It resolves imports from the entry file, transforms JS/TS, processes assets, builds the dependency graph and outputs one bundle that the app loads. In release builds the bundle is precompiled to Hermes bytecode.</p>`],
["Hermes, JSI and the JS engine",`<p>Hermes is the default engine: bytecode precompiled at build time, so faster startup and lower memory. JSI is the C++ layer that lets JS hold direct references to native objects.</p>`],
["Module Federation in React Native (your IndiGo work)",`<ul><li>Shell app loads mini apps at runtime; each mini app is built and deployed independently.</li><li>Shared dependencies (react, react-native, navigation) must be singletons with compatible versions.</li><li>Handle a mini app failing to load with a fallback screen.</li><li>Test contract between shell and mini apps; version it.</li></ul>`]]},

{id:"native",n:"Android & iOS",lead:"Platform questions in your notes.",q:[
["AndroidManifest.xml",`<p>Android reads it before launching. It declares package name, app name and icon, Activities, Services, Receivers, Providers, permissions, launcher activity, deep-link intent filters. Min and target SDK usually live in Gradle.</p>`],
["AppDelegate (iOS)",`<p>iOS entry point. Receives lifecycle events: launch, active, background, push registration, deep links, background tasks. In React Native it starts the React Native app (or via SceneDelegate on newer iOS).</p>`],
["Lifecycles",`<p><b>Android Activity:</b> onCreate → onStart → onResume (visible, interactive) → onPause → onStop → onDestroy. Returning from background: onRestart → onStart → onResume.</p><p><b>iOS:</b> Not Running → Inactive → Active → Background → Suspended. Hooks: didFinishLaunching, didBecomeActive, willResignActive, didEnterBackground, willEnterForeground, willTerminate.</p><p>In RN use <code>AppState</code> to react to foreground and background.</p>`],
["Activity vs Fragment",`<p>An Activity is a full screen and can exist alone. A Fragment is a reusable part of a screen hosted inside an Activity, with its own lifecycle tied to the host. Key detail: <code>onDestroyView()</code> destroys the Fragment’s view while the Fragment object may live on. RN comparison: Activity ≈ native screen; Fragment ≈ reusable UI piece.</p>`],
["Gradle",`<p>Android’s build tool: dependencies, compile, APK/AAB output, build variants (debug, release), flavors, signing. Commands: <code>./gradlew clean</code>, <code>assembleDebug</code>, <code>assembleRelease</code>, <code>bundleRelease</code>, <code>installDebug</code>.</p>`],
["CocoaPods, Podfile, Podfile.lock",`<ul><li>CocoaPods is iOS’s dependency manager (npm for JS, Gradle for Android).</li><li>A Pod is an iOS library such as Firebase or React-Core.</li><li>Podfile lists what to install; Podfile.lock pins exact versions so everyone and CI match (like package-lock).</li><li><code>pod install</code> reads Podfile, downloads pods, builds the Pods project, writes the lock, updates the workspace.</li><li>Open <code>.xcworkspace</code>, not <code>.xcodeproj</code>.</li><li>After adding a native library: <code>cd ios && pod install</code>.</li></ul>`],
["Service, IntentService, Data Binding",`<p>Service: background work, runs on the main thread by default. IntentService: own worker thread, stops itself, now deprecated. Use WorkManager for deferrable work, a foreground service when the user must see it. Data Binding binds XML views to a ViewModel, cutting <code>findViewById</code> boilerplate; common in MVVM.</p>`],
["Push notifications: full flow",`<ol><li>App asks permission (required on iOS, and Android 13+).</li><li>Gets a device token from FCM (Android) or APNs (iOS, usually via FCM).</li><li>Sends token to backend; refresh it when it changes; remove on logout.</li><li>Backend sends to FCM/APNs, which deliver to the device.</li><li>Handle three states: foreground (<code>onMessage</code>, show it yourself), background, quit (read the notification that opened the app).</li></ol><p>Android needs notification channels (8+). Libraries: <code>@react-native-firebase/messaging</code> plus Notifee for display. Local notifications need no server.</p>`],
["Deep linking",`<ul><li>Custom scheme (<code>tripare://trip/123</code>), Universal Links (iOS), App Links (Android).</li><li>React Navigation <code>linking</code> config maps URLs to screens; handle cold and warm start.</li><li>Validate scheme, host, path and params. Never trust values like <code>amount</code> in a link; the backend decides.</li><li>If logged out, save the link, login, then continue.</li><li>Test: <code>adb shell am start -a android.intent.action.VIEW -d "tripare://trip/123"</code> and <code>xcrun simctl openurl booted "tripare://trip/123"</code>.</li></ul>`]]},

{id:"perf",n:"Performance",lead:"Optimisation questions with steps.",q:[
["App is slow. What do you do, step by step?",`<ol><li>Define the symptom: slow startup, janky scroll, slow screen, memory growth.</li><li>Measure in a release build, not debug. Use React DevTools Profiler, Hermes profiler, Flipper or Perf Monitor, Android Studio Profiler, Xcode Instruments.</li><li>Find the cause: wasted re-renders, heavy JS on the main thread, big images, long lists, large bundle.</li><li>Fix one thing, re-measure, keep what helped.</li><li>Add monitoring so regressions show up.</li></ol>`],
["Rendering and JS thread",`<ul><li><code>React.memo</code>, <code>useMemo</code>, <code>useCallback</code> where profiling shows churn.</li><li>Split state so a change does not re-render the whole tree; use selectors.</li><li>Use <code>InteractionManager</code> or defer heavy work after a transition.</li><li>Animations with Reanimated on the UI thread and <code>useNativeDriver</code>.</li><li>Remove <code>console.log</code> in production.</li></ul>`],
["Startup time",`<ul><li>Hermes on; inline requires or lazy load screens.</li><li>Defer non-critical SDK init until after first render.</li><li>Keep splash up only until the first screen is ready.</li><li>Measure with <code>performance.timeOrigin</code> and <code>performance.now()</code>: time from JS init to first screen ready.</li></ul>`],
["Images, bundle size, memory",`<ul><li>Right-sized images, caching library (FastImage), WebP.</li><li>Remove unused libraries; analyse the bundle; enable R8 and shrinkResources on Android.</li><li>Clean up listeners, timers and subscriptions in effect cleanup to stop leaks.</li></ul>`],
["Inline cache, execution context, IIFE",`<p>Inline caching: the JS engine caches object property lookup info to speed repeated access. Execution context: the environment holding variables, scope and <code>this</code> while code runs. IIFE: a function that runs immediately, creating a private scope.</p>`],
["Production monitoring architecture",`<p>App (JS errors, native crashes, performance) → Sentry or Crashlytics → stack trace, device and session context → dashboard and alerts → fix → gradual release → monitor again.</p><p class="say">“If crash rate rose in 2.5.0, I compare crash-free users with 2.4.0, group by version, OS and device, check breadcrumbs near the failing flow, fix and add a regression test, release to a small percentage, and confirm the rate drops before going to everyone.”</p>`]]},

{id:"debug",n:"Debugging",lead:"Find and fix issues on Android and iOS.",q:[
["General method, step by step",`<ol><li>Reproduce: OS version, device, debug vs release, Hermes, network.</li><li>Decide: JS error or native crash? Red screen and Metro log mean JS. App closes silently means native.</li><li>Read the right log (below).</li><li>Isolate: remove recent changes, bisect commits, test on another device.</li><li>Fix, add a test or checklist item, test both platforms.</li><li>Release gradually and watch Sentry or Crashlytics.</li></ol>`],
["Android: debug step by step",`<ol><li>Start the bundler and device: <code>adb devices</code>, <code>npx react-native run-android</code>.</li><li>Native logs: <code>adb logcat *:E</code> or Logcat in Android Studio; filter by app package.</li><li>Crash on launch: look for <code>FATAL EXCEPTION</code> and the first “Caused by”.</li><li>Build failure: <code>cd android && ./gradlew clean</code>, then rebuild; check Gradle, JDK and SDK versions, duplicate libraries.</li><li>Release-only crash: usually R8 stripping classes; add keep rules in <code>proguard-rules.pro</code>.</li><li>Metro connection problems: <code>adb reverse tcp:8081 tcp:8081</code>.</li><li>Check manifest: permissions, exported components, cleartext traffic.</li></ol>`],
["iOS: debug step by step",`<ol><li>Install pods after any native change: <code>cd ios && pod install</code>; open the workspace.</li><li>Run from Xcode to see the console and breakpoints; use Xcode Debug Navigator and Instruments for memory and CPU.</li><li>Crash logs: Xcode Organizer or device console; check the symbolicated stack.</li><li>Build failure: Product → Clean Build Folder; delete DerivedData; <code>pod deintegrate && pod install</code> if pods are corrupted.</li><li>Signing errors: check certificate, App ID, provisioning profile and capabilities.</li><li>Missing permission text in Info.plist makes the app crash on access (camera, location, photos).</li></ol>`],
["JS debugging tools",`<ul><li>React Native DevTools / Hermes debugger, React DevTools, Flipper (network, layout, logs).</li><li>Reactotron or network inspector for API calls.</li><li>Sentry breadcrumbs for production.</li></ul>`],
["Works on one platform only",`<p>Check platform differences: safe areas, keyboard behaviour, permissions, shadow vs elevation, font rendering, <code>Platform.select</code>. Then read the native log of the failing platform, not the JS log alone.</p>`],
["Quick traps from your notes",`<ul><li><code>var a=[1,2,3]; var b=a; b.push(4); console.log(a)</code> prints <code>[1,2,3,4]</code>: arrays are references.</li><li>Loop with <code>let i</code> declared outside and <code>setTimeout</code> logging <code>i</code> prints <code>3</code> three times: one shared variable.</li><li>Normal function in an object: <code>this</code> is the object. Arrow function: <code>this</code> is inherited from outer scope (not the object).</li></ul>`]]},

{id:"sec",n:"Security",lead:"Top answers from your security notes.",q:[
["One-line answer to remember",`<p class="say">“I treat the React Native client as untrusted: protect credentials with Keychain or Keystore, use HTTPS, never ship real secrets, harden release builds, minimise sensitive data, and enforce authorization on the backend.”</p>`],
["AsyncStorage vs Keychain/Keystore, JWT storage",`<p>AsyncStorage is plain persistent storage. Tokens go in Keychain (iOS) or Keystore (Android) via <code>react-native-keychain</code>. Use short-lived access tokens, refresh tokens with rotation and revocation, HTTPS.</p>`],
["Can we hide API secrets in the app? Are .env files safe?",`<p>No. Anything in the APK or IPA can be extracted. <code>.env</code> is fine for config like the API URL, not for secrets. Keep real secrets on the backend.</p>`],
["Certificate pinning, MITM, HTTPS",`<p>Pinning checks the server certificate or public key against an expected one, reducing MITM risk. It needs a rotation plan or an expired cert breaks the app. Block cleartext on Android (<code>usesCleartextTraffic="false"</code>); configure ATS on iOS.</p>`],
["Is frontend authorization enough? Auth vs authz",`<p>No. UI checks only hide screens. Authentication is who you are; authorization is what you can do, enforced by the backend on every request.</p>`],
["Reverse engineering, release hardening, logs",`<ul><li>R8/ProGuard with <code>minifyEnabled</code> and <code>shrinkResources</code>, no debug in release.</li><li>No tokens, passwords or personal data in logs or crash reports.</li><li>Obfuscation slows attackers; it does not stop them.</li></ul>`],
["Biometrics, root detection, WebView, replay attacks",`<ul><li>Biometrics unlock a securely stored credential; they are not server identity.</li><li>Root or jailbreak detection is one extra signal, not the only control.</li><li>WebView: allowlist domains, limit injected JS and navigation.</li><li>Replay: short expiry, rotation, revocation, nonces or request signing.</li></ul>`]]},

{id:"rel",n:"Releases",lead:"Play Store, App Store, Fastlane. A named duty of this role.",q:[
["Android release steps",`<ol><li>Bump <code>versionCode</code> (integer, must increase) and <code>versionName</code> (shown to users).</li><li>Build a signed AAB: <code>./gradlew bundleRelease</code>.</li><li>Upload to Play Console: internal → closed → open → production.</li><li>Complete listing, content rating, Data Safety form.</li><li>Submit, then use a staged rollout (e.g. 10%) and watch crashes.</li></ol>`],
["APK vs AAB, keystore, Play App Signing",`<p>An AAB lets Google Play build optimised APKs per device (smaller downloads). The keystore holds the signing key; with Play App Signing, Google holds the app key and you keep an upload key. Lose the upload key without that setup and you cannot update. Back it up securely.</p>`],
["iOS release steps",`<ol><li>Create the app in App Store Connect with its bundle ID.</li><li>Certificates and provisioning profiles (or automatic signing, or Fastlane match).</li><li>Bump the build number, archive in Xcode.</li><li>Validate and upload (Organizer or Transporter), then TestFlight.</li><li>Complete metadata, screenshots, App Privacy details.</li><li>Submit for review; choose manual, scheduled or phased release.</li></ol>`],
["Certificate, App ID, provisioning profile",`<p>Certificate identifies the developer and signs the app. App ID identifies the app and capabilities (push, App Groups). Profile ties certificate, App ID and devices together. Most signing failures come from a mismatch among these. Build types: Development, Ad Hoc, App Store, Enterprise.</p>`],
["TestFlight, review time, common rejections",`<p>TestFlight: up to 100 internal testers (no review), up to 10,000 external (light review). Review takes hours to a couple of days. Common rejections: crashes, incomplete metadata, privacy label not matching SDK behaviour, broken privacy-policy link, excess permissions.</p>`],
["Fastlane and CI/CD",`<ul><li><code>match</code> signing, <code>gym</code> iOS build, <code>pilot</code> TestFlight, <code>supply</code> Play upload.</li><li>One lane per environment; run from GitHub Actions or Jenkins (both on your CV).</li><li>Secrets in CI secret store, never in git.</li><li>One source of truth for version, synced to <code>versionCode/versionName</code> and <code>CFBundleVersion/ShortVersion</code>.</li></ul>`],
["Scenario: urgent fix while review is pending",`<p>iOS: wait, or remove the build from review and submit the fixed build. Android: upload a new build to the track. Then use an expedited review request only for real emergencies.</p>`],
["Scenario: build works locally, fails in TestFlight or Play",`<p>Check: it is a release build with correct endpoints; certificates and profiles valid, or the right keystore used; build number incremented (stores reject duplicates); entitlements and permissions present in the signed build.</p>`],

const second = a =&gt; { let m = -Infinity, s = -Infinity;
  for (const n of a) { if (n &gt; m) { s = m; m = n; } else if (n &lt; m &amp;&amp; n &gt; s) s = n; }
  return s; };
// reverse string
const rev = s =&gt; { let r = ""; for (let i = s.length - 1; i &gt;= 0; i--) r += s[i]; return r; };
// palindrome
const pal = s =&gt; { let i = 0, j = s.length - 1;
  while (i &lt; j) if (s[i++] !== s[j--]) return false; return true; };
// duplicates
const dup = a =&gt; { const seen = new Set(), d = new Set();
  a.forEach(x =&gt; seen.has(x) ? d.add(x) : seen.add(x)); return [...d]; };</pre>`],

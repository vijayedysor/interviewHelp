<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NorthLadder — Interview Prep</title>
<style>
:root{
  --bg:#000000;
  --bg-raised:#0d0d0d;
  --bg-hover:#161616;
  --line:#2b2b2b;
  --line-soft:#1a1a1a;
  --fg:#f5f5f5;
  --fg-dim:#9a9a9a;
  --fg-faint:#5c5c5c;
  --white:#ffffff;
  --black:#000000;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:'IBM Plex Mono','SF Mono',Consolas,Menlo,monospace;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:0;}
::-webkit-scrollbar-thumb:hover{background:var(--fg-faint);}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--line);
  padding:28px 32px 24px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.92);
  backdrop-filter:blur(6px);
  z-index:50;
}
.header-inner{max-width:1180px;margin:0 auto;}
.brand-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.brand .prompt{color:var(--fg-faint);font-size:15px;}
.brand h1{
  font-size:18px;
  font-weight:600;
  letter-spacing:0.02em;
  margin:0;
  color:var(--white);
}
.brand h1 .cursor{
  display:inline-block;
  width:8px;height:16px;
  background:var(--white);
  margin-left:2px;
  vertical-align:middle;
  animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0;}}
.stat-strip{
  display:flex;
  gap:22px;
  font-size:12px;
  color:var(--fg-dim);
  letter-spacing:0.03em;
}
.stat-strip b{color:var(--white);font-weight:600;}

.search-row{
  margin-top:20px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.search-box{
  flex:1 1 200px;
  position:relative;
  min-width:0;
}
.search-box input{
  width:100%;
  background:var(--bg-raised);
  border:1px solid var(--line);
  color:var(--fg);
  font-family:inherit;
  font-size:16px;
  padding:12px 14px 12px 34px;
  outline:none;
  transition:border-color .15s ease;
}
.search-box input::placeholder{color:var(--fg-faint);}
.search-box input:focus{border-color:var(--fg-dim);}
.search-box::before{
  content:"›_";
  position:absolute;
  left:12px;top:50%;
  transform:translateY(-50%);
  color:var(--fg-faint);
  font-size:13px;
  pointer-events:none;
}
.clear-btn{
  background:transparent;
  border:1px solid var(--line);
  color:var(--fg-dim);
  font-family:inherit;
  font-size:12px;
  padding:12px 16px;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s ease;
}
.clear-btn:hover{border-color:var(--fg-dim);color:var(--fg);}

.result-count{
  margin-top:10px;
  font-size:12px;
  color:var(--fg-faint);
  letter-spacing:0.02em;
}
.result-count b{color:var(--fg-dim);}

/* ---------- layout ---------- */
.layout{
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:230px 1fr;
  gap:0;
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{
    position:static;
    border-right:none;
    border-bottom:1px solid var(--line);
    max-height:none;
    padding:10px 0;
    background:var(--bg);
  }
  .sidebar .eyebrow{display:none;}
  #catList{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    gap:6px;
    padding:0 12px;
    scrollbar-width:thin;
  }
  .cat-btn{
    width:auto;
    flex:0 0 auto;
    border:1px solid var(--line);
    border-left:1px solid var(--line);
    padding:7px 12px;
    font-size:12px;
    white-space:nowrap;
    background:var(--bg-raised);
  }
  .cat-btn.active{border-color:var(--white);border-left-color:var(--white);}
  .cat-btn .n{margin-left:6px;}
}

/* ---------- sidebar ---------- */
.sidebar{
  border-right:1px solid var(--line);
  padding:24px 16px 60px 0;
  position:sticky;
  top:132px;
  align-self:start;
  max-height:calc(100vh - 132px);
  overflow-y:auto;
}
.sidebar .eyebrow{
  font-size:11px;
  color:var(--fg-faint);
  text-transform:uppercase;
  letter-spacing:0.12em;
  padding:0 16px 10px;
}
.cat-btn{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  background:transparent;
  border:none;
  border-left:2px solid transparent;
  color:var(--fg-dim);
  font-family:inherit;
  font-size:13px;
  text-align:left;
  padding:9px 16px;
  cursor:pointer;
  transition:all .12s ease;
}
.cat-btn:hover{color:var(--fg);background:var(--bg-hover);}
.cat-btn.active{
  color:var(--white);
  border-left-color:var(--white);
  background:var(--bg-hover);
}
.cat-btn .n{
  font-size:11px;
  color:var(--fg-faint);
  font-variant-numeric:tabular-nums;
}
.cat-btn.active .n{color:var(--fg-dim);}

/* ---------- main ---------- */
main{padding:28px 24px 100px;min-width:0;}
.cat-group{margin-bottom:8px;}
.cat-heading{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin:36px 0 14px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line-soft);
}
.cat-heading:first-child{margin-top:0;}
.cat-heading .idx{
  color:var(--fg-faint);
  font-size:12px;
}
.cat-heading h2{
  font-size:15px;
  font-weight:600;
  color:var(--white);
  margin:0;
  letter-spacing:0.01em;
}
.cat-heading .count{
  color:var(--fg-faint);
  font-size:12px;
  margin-left:auto;
}

.card{
  border:1px solid var(--line-soft);
  margin-bottom:8px;
  background:var(--bg-raised);
  transition:border-color .12s ease;
}
.card:hover{border-color:var(--line);}
.card.open{border-color:var(--fg-faint);}

.card-q{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  background:transparent;
  border:none;
  color:var(--fg);
  font-family:inherit;
  font-size:14px;
  text-align:left;
  padding:14px 16px;
  cursor:pointer;
}
.card-q .qmark{
  color:var(--fg-faint);
  font-size:13px;
  flex-shrink:0;
  width:14px;
}
.card-q .qtext{flex:1;}
.card-q .chev{
  color:var(--fg-faint);
  font-size:12px;
  transition:transform .15s ease;
  flex-shrink:0;
}
.card.open .card-q .chev{transform:rotate(90deg);color:var(--fg);}

.card-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .22s ease;
}
.card.open .card-body{max-height:4000px;}
.card-body-inner{
  padding:0 16px 18px 42px;
  border-top:1px solid var(--line-soft);
  padding-top:14px;
}
.answer{
  color:var(--fg-dim);
  font-size:13.5px;
  line-height:1.65;
  margin:0 0 12px;
}
.example-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--fg-faint);
  margin:0 0 8px;
}
pre{
  background:#000;
  border:1px solid var(--line-soft);
  padding:12px 14px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  margin:0;
  font-size:12.5px;
  line-height:1.6;
  color:#e6e6e6;
  max-width:100%;
}
pre code{font-family:inherit;white-space:pre;}

/* ---------- mobile tuning ---------- */
@media (max-width:640px){
  header{padding:16px 16px 14px;}
  .brand h1{font-size:15px;}
  .brand .prompt{font-size:13px;}
  .stat-strip{font-size:11px;gap:14px;}
  .search-box input{padding:11px 12px 11px 30px;font-size:16px;}
  .clear-btn{padding:11px 12px;font-size:11px;}
  main{padding:16px 12px 80px;}
  .cat-heading{margin:26px 0 12px;}
  .cat-heading h2{font-size:14px;}
  .card-q{padding:12px 12px;font-size:13.5px;gap:8px;}
  .card-body-inner{padding:12px 12px 16px 12px;}
  .answer{font-size:13px;}
  pre{font-size:11.5px;padding:10px 10px;}
  footer{padding:18px 16px;font-size:10px;}
}
.plain-example{
  background:#000;
  border-left:2px solid var(--fg-faint);
  padding:10px 14px;
  font-size:13px;
  color:var(--fg-dim);
  font-style:italic;
  line-height:1.6;
}

mark{
  background:var(--white);
  color:var(--black);
  padding:0 1px;
}

.empty-state{
  padding:80px 20px;
  text-align:center;
  color:var(--fg-faint);
}
.empty-state .glyph{font-size:26px;margin-bottom:14px;color:var(--fg-dim);}
.empty-state p{margin:4px 0;font-size:13px;}

footer{
  border-top:1px solid var(--line);
  padding:24px 32px;
  text-align:center;
  color:var(--fg-faint);
  font-size:11px;
  letter-spacing:0.03em;
}

kbd{
  background:var(--bg-hover);
  border:1px solid var(--line);
  padding:1px 6px;
  font-size:11px;
  color:var(--fg-dim);
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-row">
      <div class="brand">
        <span class="prompt">$</span>
        <h1>northladder<span style="color:var(--fg-faint)">@</span>interview-prep<span class="cursor"></span></h1>
      </div>
      <div class="stat-strip">
        <span><b id="statTotal">0</b> questions</span>
        <span><b id="statCats">0</b> categories</span>
      </div>
    </div>
    <div class="search-row">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="grep -i 'closures, useMemo, sprint planning, WCAG...'" autocomplete="off">
      </div>
      <button class="clear-btn" id="clearBtn">clear ×</button>
    </div>
    <div class="result-count" id="resultCount"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="eyebrow">// categories</div>
    <div id="catList"></div>
  </aside>

  <main id="main">
    <!-- populated by JS -->
  </main>
</div>

<footer>
  press <kbd>/</kbd> to search — built for the NorthLadder frontend leadership loop
</footer>

<script id="qdata" type="application/json">[{"cat": "HR Screening", "q": "Tell me about yourself.", "a": "Keep it to a 60-90 second arc: current role and scope, one or two career-defining wins, then why you're looking now. Lead with impact, not a chronological resume dump.", "code": "Example answer: \"I'm a frontend engineer with 7 years' experience, the last 3 leading a 5-person team at a fintech startup. I rebuilt our checkout flow into a component library that cut new-feature time by 40%, and I mentor 2 junior devs. I'm looking for a role with more architectural ownership across a larger product surface -- which is why NorthLadder's platform rebuild caught my eye.\"", "lang": ""}, {"cat": "HR Screening", "q": "Why are you interested in NorthLadder?", "a": "Show you researched the company: their product, tech stack, or a recent challenge (scaling, a migration, a market move), and connect it to what you want to do next.", "code": "Example answer: \"I saw your engineering blog post about migrating to the Next.js App Router -- I led a similar migration and know the pain points around data fetching patterns. I want to join a team that's actively modernizing rather than maintaining legacy code, and your emphasis on a shared design system matches the systems-thinking work I enjoy.\"", "lang": ""}, {"cat": "HR Screening", "q": "Why are you leaving your current role?", "a": "Stay forward-looking and specific: what you want next that your current role can't offer (scope, tech, team size), never trash-talk a manager or company.", "code": "Example answer: \"I've taken our frontend architecture as far as I can at our current scale -- we're a 4-person team on one product. I want to work on a platform serving more users with a larger engineering org, where I can grow into cross-team architectural decisions.\"", "lang": ""}, {"cat": "HR Screening", "q": "What kind of engineering culture do you enjoy?", "a": "Describe concrete practices, not adjectives: code review norms, how decisions get made, how failure is handled -- and tie it to evidence from your own experience.", "code": "Example answer: \"I thrive where code review is a teaching tool, not a gate -- comments explain the 'why', not just 'fix this'. I also like blameless postmortems; after a production bug I once ran one and we came out with a better deploy checklist, not a scapegoat.\"", "lang": ""}, {"cat": "HR Screening", "q": "Why should we hire you for a frontend leadership role?", "a": "Pair a technical credibility point with a people-leadership point, and back both with a measurable result.", "code": "Example answer: \"I combine deep React/Next.js expertise with two years of directly managing engineers -- I've shipped a design system used by 6 teams, and grown two juniors into mid-level engineers via structured 1:1s and stretch assignments. I can both set technical direction and develop the people executing it.\"", "lang": ""}, {"cat": "HR Screening", "q": "What has been your biggest achievement in the last two years?", "a": "Use a single, quantified story with your specific contribution called out, not a team accomplishment described in 'we' language alone.", "code": "Example answer: \"I led the migration of our legacy CRA app to Next.js with incremental static regeneration, cutting median page load from 3.2s to 900ms and lifting our Lighthouse SEO score from 62 to 96 -- which fed directly into a 15% signup conversion lift.\"", "lang": ""}, {"cat": "HR Screening", "q": "Have you managed engineers directly?", "a": "Answer with reporting-line facts (headcount, levels, duration) then one concrete management action, not just responsibilities.", "code": "Example answer: \"Yes -- 3 direct reports (2 mid-level, 1 junior) for the past 18 months, including performance reviews and career-ladder conversations. I put one engineer on a growth plan around code-review quality and she was promoted two quarters later.\"", "lang": ""}, {"cat": "HR Screening", "q": "How many people have you mentored or led?", "a": "Give a real number and distinguish formal reports from informal mentoring so the interviewer can calibrate scope.", "code": "Example answer: \"3 direct reports currently, plus I've formally mentored 5 engineers across two companies through onboarding buddy programs and a frontend guild I started.\"", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you manage a team of frontend engineers?", "a": "Describe your operating rhythm: weekly 1:1s, sprint planning, code review standards, and how you balance hands-on coding with unblocking others.", "code": "Example: weekly 1:1s focused on career + blockers (not status), async standups in Slack, a rotating 'tech lead of the week' for code review triage, and I keep 20% of my week coding to stay credible on architecture decisions.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you handle low-performing developers?", "a": "Show a structured process: clarify expectations, give specific feedback with examples, set a time-bound improvement plan, escalate if no change.", "code": "Example: \"I sat with an underperforming dev, showed 3 specific PRs where scope wasn't met, agreed on a 30-day plan with weekly checkpoints and pairing sessions. He improved on 2 of 3 metrics; we extended 2 more weeks and he hit the bar.\"", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you mentor junior engineers?", "a": "Talk about pairing, stretch tickets slightly above their level, and code review as teaching -- with a concrete before/after result.", "code": "Example: I pair on the first ticket of a new area, then hand off similar tickets solo with review. One junior went from needing line-by-line guidance to owning our form-validation library in 4 months.", "lang": ""}, {"cat": "Leadership & Management", "q": "What do you expect during code reviews?", "a": "Cover both mechanics (small PRs, tests, CI green) and tone (explain the why, suggest don't dictate, approve with nits rather than blocking on style).", "code": "Checklist: PR < 400 lines diff, tests cover the new branch logic, no console.log left in, comments explain reasoning not just 'change this', and reviewer responds within 4 business hours to keep flow moving.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you resolve technical disagreements?", "a": "Show a decision framework: get both sides to state tradeoffs in writing, use data or a small spike when possible, escalate to a tie-breaker only as last resort.", "code": "Example: two engineers disagreed on Redux vs Context+useReducer. I had each write a 1-page tradeoff doc, we time-boxed a half-day spike on both, and picked Context+useReducer because our state was shallow and it cut a dependency.", "lang": ""}, {"cat": "Leadership & Management", "q": "Tell us about a time you disagreed with Product or Design.", "a": "Use a STAR structure: the disagreement, how you made your case with data/user impact, and the resolution -- even if you didn't get your way.", "code": "Example: Design wanted a custom date picker; I flagged it would cost 2 sprints and hurt accessibility. I prototyped an accessible library-based alternative in a day to show it was viable, and we shipped it instead -- saving ~8 engineering days.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you estimate frontend work?", "a": "Mention breaking stories into tasks, referencing historical velocity, and flagging unknowns (design gaps, third-party API risk) as separate risk buffers rather than padding every estimate blindly.", "code": "Example: I break a feature into UI states (empty/loading/error/success), estimate each against similar past tickets, then add a fixed 20% buffer only for tasks touching unfamiliar APIs.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you handle deadline pressure?", "a": "Show you triage scope rather than silently cutting quality -- negotiate what ships now vs later, and communicate early rather than at the deadline.", "code": "Example: two days before a launch, I identified 3 nice-to-have polish items, got PM sign-off to cut them, and used the recovered time to fix a checkout bug that would have blocked payments.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you prioritize bugs vs new features?", "a": "Use a severity/impact framework (data loss or blocked revenue beats cosmetic issues) and describe how you communicate the tradeoff to stakeholders.", "code": "Framework: P0 (data loss, broken checkout) fixed same day; P1 (major flow degraded) fixed within the sprint; P2 (cosmetic) goes in the backlog and gets triaged against feature work each planning session.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you keep engineers motivated?", "a": "Talk about autonomy, visible impact, and growth opportunities -- not just perks or praise.", "code": "Example: I let engineers pick which of two equally-valued tickets to own, share user-facing impact metrics in team channel after launches, and rotate 'first pick' on interesting greenfield work.", "lang": ""}, {"cat": "Leadership & Management", "q": "Walk us through your sprint planning process.", "a": "Describe backlog grooming before the meeting, capacity planning against PTO/on-call, and how stories get broken down and estimated live.", "code": "Flow: groom backlog Thursday, estimate top items async via planning poker, Monday planning meeting confirms capacity (subtract PTO/on-call), commit to a sprint goal plus stretch items, not just a task list.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you estimate React features?", "a": "Break by UI states and integration points, and call out anything touching new libraries or backend contracts as higher risk.", "code": "Example: a 'user profile edit' feature = form UI (1pt) + validation (1pt) + API integration (2pt, unknown backend contract) + optimistic update/error states (2pt) = 6pt total, flagged as risky due to the unknown contract.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you identify risks early?", "a": "Mention spikes for unknowns, dependency mapping (backend, design, third-party), and flagging risk in planning rather than mid-sprint.", "code": "Example: before committing to a payments integration story, I ran a half-day spike against the sandbox API and found a webhook limitation that reshaped our estimate before we committed the sprint.", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you communicate delays?", "a": "Communicate early with the reason, the new date, and the mitigation -- not just an apology after the deadline passes.", "code": "Example message: \"Heads up -- the API contract for checkout changed mid-sprint, pushing delivery from Thu to Mon. I've descoped the retry-logic polish to protect the date if needed.\"", "lang": ""}, {"cat": "Leadership & Management", "q": "How do you split large frontend stories?", "a": "Vertical slices by user-visible state (empty/loading/success/error) or by page section, so each slice ships independent value rather than horizontal layers that can't ship alone.", "code": "Example: split 'build dashboard' into: static layout shell, live data for top widget, remaining widgets, empty/error states, and polish -- each independently shippable behind a feature flag.", "lang": ""}, {"cat": "JavaScript", "q": "Explain the Event Loop.", "a": "JS is single-threaded. The call stack runs synchronous code; async callbacks go into task queues. The event loop checks: is the stack empty? If yes, pull the next task from the microtask queue (fully drained) then one macrotask, and repeat.", "code": "console.log('1');\nsetTimeout(() => console.log('2'), 0);\nPromise.resolve().then(() => console.log('3'));\nconsole.log('4');\n// Output: 1, 4, 3, 2\n// sync code first, then microtasks (promises), then macrotasks (setTimeout)", "lang": "javascript"}, {"cat": "JavaScript", "q": "What are microtasks and macrotasks?", "a": "Microtasks (Promise.then, queueMicrotask, MutationObserver) run immediately after the current stack empties and the queue is drained fully before rendering. Macrotasks (setTimeout, setInterval, I/O, UI events) run one per event-loop tick.", "code": "setTimeout(() => console.log('macro'), 0);\nqueueMicrotask(() => console.log('micro'));\n// 'micro' logs before 'macro' every time", "lang": "javascript"}, {"cat": "JavaScript", "q": "Difference between == and ===.", "a": "=== compares value and type with no coercion (strict equality). == coerces operands to a common type before comparing, which causes surprising results -- prefer === by default.", "code": "0 == '0'      // true  (coerced)\n0 === '0'     // false (different types)\nnull == undefined   // true\nnull === undefined  // false", "lang": "javascript"}, {"cat": "JavaScript", "q": "Explain closures with a real-world example.", "a": "A closure is a function that retains access to its defining scope's variables even after that outer function has returned. Used for data privacy, memoization, and factory functions.", "code": "function createCounter() {\n  let count = 0;\n  return () => ++count; // 'count' stays alive via closure\n}\nconst counter = createCounter();\ncounter(); // 1\ncounter(); // 2 -- private state, no external access to 'count'", "lang": "javascript"}, {"cat": "JavaScript", "q": "What is lexical scope?", "a": "Variable lookup is determined by where a function is physically written in the code, not by where it's called from. Inner functions can access outer variables based on nesting at write-time.", "code": "const x = 10;\nfunction outer() {\n  const y = 20;\n  function inner() {\n    console.log(x, y); // resolves via lexical (write-time) scope, not call-time\n  }\n  inner();\n}", "lang": "javascript"}, {"cat": "JavaScript", "q": "Explain hoisting.", "a": "Declarations are moved to the top of their scope during compilation. var declarations are hoisted and initialized as undefined; let/const are hoisted but stay in a 'temporal dead zone' until their line executes; function declarations are hoisted fully.", "code": "console.log(a); // undefined (var hoisted)\nvar a = 1;\n\nconsole.log(b); // ReferenceError (temporal dead zone)\nlet b = 2;", "lang": "javascript"}, {"cat": "JavaScript", "q": "How does 'this' work?", "a": "'this' is determined by how a function is called, not where it's defined: object.method() binds to the object, a plain call binds to undefined (strict mode) or global, arrow functions inherit 'this' lexically from their enclosing scope.", "code": "const obj = {\n  name: 'a',\n  regular() { return this.name; },       // 'a' -- called as obj.regular()\n  arrow: () => this?.name,                // undefined -- inherits outer 'this'\n};", "lang": "javascript"}, {"cat": "JavaScript", "q": "call(), apply(), and bind().", "a": "All three set the 'this' context for a function. call() invokes immediately with args listed individually, apply() invokes immediately with args as an array, bind() returns a new function with 'this' permanently fixed, invoked later.", "code": "function greet(greeting) { return greeting + ', ' + this.name; }\ngreet.call({name:'Sam'}, 'Hi');      // 'Hi, Sam' -- invokes now\ngreet.apply({name:'Sam'}, ['Hi']);   // 'Hi, Sam' -- args as array\nconst bound = greet.bind({name:'Sam'});\nbound('Hi');                          // invoked later, 'this' locked", "lang": "javascript"}, {"cat": "JavaScript", "q": "Deep copy vs shallow copy.", "a": "A shallow copy duplicates the top-level structure but nested objects still share references with the original. A deep copy recursively clones every nested level so the two are fully independent.", "code": "const original = { a: 1, nested: { b: 2 } };\nconst shallow = { ...original };\nshallow.nested.b = 99; // mutates original.nested.b too!\n\nconst deep = structuredClone(original); // true independent copy", "lang": "javascript"}, {"cat": "JavaScript", "q": "Debounce vs throttle.", "a": "Debounce delays execution until a pause in events (fires once after activity stops -- good for search-as-you-type). Throttle guarantees execution at most once per interval regardless of event frequency -- good for scroll/resize handlers.", "code": "function debounce(fn, delay) {\n  let t;\n  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };\n}\nfunction throttle(fn, limit) {\n  let wait = false;\n  return (...args) => {\n    if (wait) return;\n    fn(...args);\n    wait = true;\n    setTimeout(() => (wait = false), limit);\n  };\n}", "lang": "javascript"}, {"cat": "JavaScript", "q": "What is currying?", "a": "Currying transforms a function of multiple arguments into a sequence of functions each taking one argument, enabling partial application and reusable configured functions.", "code": "const add = a => b => c => a + b + c;\nadd(1)(2)(3); // 6\nconst add5 = add(5);\nadd5(2)(3);   // 10 -- reusable partial application", "lang": "javascript"}, {"cat": "JavaScript", "q": "Explain promises internally.", "a": "A Promise is a state machine: pending -> fulfilled or rejected (once, irreversibly). .then/.catch register callbacks queued as microtasks once the state settles, enabling chaining that flattens nested async callbacks.", "code": "new Promise((resolve, reject) => {\n  setTimeout(() => resolve('done'), 100);\n})\n  .then(v => v + '!')\n  .then(console.log) // 'done!'\n  .catch(err => console.error(err));", "lang": "javascript"}, {"cat": "JavaScript", "q": "How does async/await work?", "a": "async/await is syntactic sugar over Promises: 'await' pauses the async function (without blocking the thread) until the awaited Promise settles, letting you write async code with synchronous-looking control flow, including try/catch for errors.", "code": "async function getUser(id) {\n  try {\n    const res = await fetch(`/api/users/${id}`);\n    if (!res.ok) throw new Error('failed');\n    return await res.json();\n  } catch (err) {\n    console.error(err);\n  }\n}", "lang": "javascript"}, {"cat": "JavaScript", "q": "Explain generators.", "a": "Generators (function*) produce an iterator that can pause and resume execution via 'yield', letting you produce values lazily one at a time -- useful for infinite sequences or custom iteration.", "code": "function* idGenerator() {\n  let id = 1;\n  while (true) yield id++;\n}\nconst gen = idGenerator();\ngen.next().value; // 1\ngen.next().value; // 2", "lang": "javascript"}, {"cat": "JavaScript", "q": "What are WeakMap and WeakSet?", "a": "Like Map/Set but keys (WeakMap) or values (WeakSet) must be objects and are held weakly, so entries can be garbage-collected once nothing else references the key -- ideal for attaching metadata to objects without causing memory leaks.", "code": "const cache = new WeakMap();\nfunction process(obj) {\n  if (cache.has(obj)) return cache.get(obj);\n  const result = expensiveCalc(obj);\n  cache.set(obj, result); // auto-cleared when obj is garbage collected\n  return result;\n}", "lang": "javascript"}, {"cat": "JavaScript", "q": "Event bubbling and event delegation.", "a": "Bubbling means an event fires on the target then propagates up through its ancestors. Delegation exploits this by attaching one listener on a common parent instead of many on each child, checking event.target to react selectively -- efficient for dynamic lists.", "code": "document.getElementById('list').addEventListener('click', (e) => {\n  if (e.target.matches('li')) {\n    console.log('clicked', e.target.textContent);\n  }\n}); // one listener handles all current and future <li> children", "lang": "javascript"}, {"cat": "React", "q": "Explain React rendering.", "a": "When state or props change, React calls the component function again to produce a new element tree ('render'), diffs it against the previous tree (reconciliation), and applies only the minimal DOM mutations needed ('commit').", "code": "function Counter() {\n  const [count, setCount] = useState(0);\n  return <button onClick={() => setCount(c => c + 1)}>{count}</button>;\n} // clicking re-runs Counter(); only the text node updates in the DOM", "lang": "jsx"}, {"cat": "React", "q": "Virtual DOM vs Real DOM.", "a": "The Virtual DOM is a lightweight JS object tree representing UI. React diffs the new virtual tree against the previous one and batches only the necessary real DOM operations, which are expensive, instead of re-rendering the whole page.", "code": "// Virtual DOM element -- just a plain JS object\n{ type: 'button', props: { onClick: fn, children: '0' } }", "lang": "javascript"}, {"cat": "React", "q": "How does React reconciliation work?", "a": "React compares elements by type and position (or 'key' for lists): same type -> update props in place and recurse into children; different type -> tear down the old subtree and mount a new one. Keys let React track identity across list reorders.", "code": "// Without stable keys, React may re-mount/re-order items incorrectly\n{items.map(item => <Row key={item.id} {...item} />)} // key={item.id}, never key={index} for reorderable lists", "lang": "jsx"}, {"cat": "React", "q": "When does React re-render?", "a": "A component re-renders when its own state changes, when it receives new props, when its parent re-renders (unless memoized), or when a consumed context value changes.", "code": "const Child = React.memo(function Child({ value }) {\n  console.log('child render');\n  return <div>{value}</div>;\n}); // re-renders only when 'value' prop actually changes", "lang": "jsx"}, {"cat": "React", "q": "useMemo vs useCallback.", "a": "useMemo memoizes a computed value; useCallback memoizes a function reference. Both skip recomputation unless dependencies change, and are used to avoid expensive recalculation or to keep referential equality stable for memoized children.", "code": "const sorted = useMemo(() => items.slice().sort(cmp), [items]);\nconst handleClick = useCallback(() => onSelect(id), [id, onSelect]);", "lang": "jsx"}, {"cat": "React", "q": "Context API vs Redux.", "a": "Context passes data through the tree without prop drilling but re-renders every consumer on any value change and has no built-in middleware/devtools. Redux centralizes state with predictable updates, middleware (thunks/sagas), and time-travel debugging -- better for complex, frequently-updated, cross-cutting state.", "code": "// Context: fine for rarely-changing global data like theme/auth\nconst ThemeContext = createContext('dark');\n// Redux/Zustand: better for frequently updated, complex app state with selectors", "lang": "jsx"}, {"cat": "React", "q": "React Query vs Redux.", "a": "React Query (TanStack Query) is purpose-built for server-state: caching, refetching, invalidation, background sync. Redux is for client-state that isn't naturally tied to a server request. Most modern apps use React Query for data fetching and a lighter tool (Context/Zustand) for UI state.", "code": "const { data, isLoading } = useQuery({\n  queryKey: ['user', id],\n  queryFn: () => fetch(`/api/users/${id}`).then(r => r.json()),\n}); // caching, retries, and refetch-on-focus handled automatically", "lang": "jsx"}, {"cat": "React", "q": "Custom Hooks.", "a": "A custom hook is a function starting with 'use' that composes built-in hooks to extract and reuse stateful logic across components without changing the component tree.", "code": "function useDebouncedValue(value, delay) {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() => {\n    const t = setTimeout(() => setDebounced(value), delay);\n    return () => clearTimeout(t);\n  }, [value, delay]);\n  return debounced;\n}", "lang": "jsx"}, {"cat": "React", "q": "Error Boundaries.", "a": "A class component implementing componentDidCatch/getDerivedStateFromError that catches JS errors thrown during rendering in its child tree and renders a fallback UI instead of crashing the whole app. They don't catch errors in event handlers or async code.", "code": "class ErrorBoundary extends React.Component {\n  state = { hasError: false };\n  static getDerivedStateFromError() { return { hasError: true }; }\n  render() {\n    return this.state.hasError ? <Fallback /> : this.props.children;\n  }\n}", "lang": "jsx"}, {"cat": "React", "q": "Suspense.", "a": "Suspense lets a component 'wait' for something (lazy-loaded code, or data with a Suspense-compatible fetcher) by showing a fallback UI until the child is ready, decoupling loading-state UI from the component tree.", "code": "const ProfilePage = React.lazy(() => import('./ProfilePage'));\n<Suspense fallback={<Spinner />}>\n  <ProfilePage />\n</Suspense>", "lang": "jsx"}, {"cat": "React", "q": "Concurrent Rendering.", "a": "React can prepare multiple versions of the UI and interrupt a low-priority render (e.g. a big list update) to handle a high-priority one (like a keypress) first, keeping the UI responsive -- enabled via startTransition/useTransition.", "code": "const [isPending, startTransition] = useTransition();\nfunction handleChange(e) {\n  setQuery(e.target.value);            // urgent\n  startTransition(() => setResults(search(e.target.value))); // can be interrupted\n}", "lang": "jsx"}, {"cat": "React", "q": "Server Components.", "a": "React Server Components render on the server only, ship zero JS to the client for that component, and can access backend resources (DB, filesystem) directly -- reducing bundle size. They can't use hooks like useState or browser APIs; interactive parts stay Client Components marked with 'use client'.", "code": "// app/page.tsx -- Server Component by default in Next.js App Router\nasync function Page() {\n  const posts = await db.query('SELECT * FROM posts'); // runs on server only\n  return <PostList posts={posts} />;\n}", "lang": "jsx"}, {"cat": "React", "q": "Controlled vs uncontrolled components.", "a": "A controlled input's value is driven entirely by React state (single source of truth, easy validation). An uncontrolled input keeps its own internal DOM state, read via a ref only when needed -- simpler for basic forms, less re-render overhead.", "code": "// Controlled\n<input value={value} onChange={e => setValue(e.target.value)} />\n// Uncontrolled\nconst ref = useRef();\n<input ref={ref} defaultValue=\"hi\" /> // read ref.current.value on submit", "lang": "jsx"}, {"cat": "React", "q": "HOCs vs Render Props vs Hooks.", "a": "All three share logic across components. HOCs wrap a component to inject props (can cause wrapper hell and prop naming collisions). Render props pass a function as a child to control what's rendered (verbose JSX nesting). Hooks extract logic into a plain function with no wrapping component -- the modern preferred approach.", "code": "// HOC\nconst withAuth = (Comp) => (props) => user ? <Comp {...props}/> : <Login/>;\n// Render prop\n<DataProvider render={data => <List data={data}/>} />\n// Hook (preferred)\nfunction List() { const data = useData(); return <ul>{...}</ul>; }", "lang": "jsx"}, {"cat": "React", "q": "How would you build a reusable component library?", "a": "Start from design tokens (color/spacing/type), build primitives (Button, Input) with a consistent variant API, document in Storybook, enforce accessibility and tests per component, and version/publish via a monorepo package so consuming apps pin versions.", "code": "// consistent variant API across the whole library\n<Button variant=\"primary\" size=\"md\" />\n<Button variant=\"ghost\" size=\"sm\" />", "lang": "jsx"}, {"cat": "React", "q": "Core Web Vitals.", "a": "LCP (Largest Contentful Paint, loading speed, target <2.5s), INP (Interaction to Next Paint, responsiveness, target <200ms), and CLS (Cumulative Layout Shift, visual stability, target <0.1) -- Google's key UX metrics that also affect SEO ranking.", "code": "// Reserve space to prevent CLS\n<img src=\"hero.jpg\" width={800} height={400} alt=\"\" /> // fixed aspect ratio avoids layout shift on load", "lang": "jsx"}, {"cat": "Next.js", "q": "SSR vs CSR vs SSG vs ISR.", "a": "CSR ships an empty shell and renders client-side (fast to host, slow first paint, poor SEO). SSR renders HTML per-request on the server (fresh data, slower TTFB). SSG pre-renders at build time (fastest, but data can go stale). ISR combines SSG with periodic background regeneration for near-static speed with fresher data.", "code": "// ISR: regenerate this page in the background at most every 60s\nexport const revalidate = 60;", "lang": "javascript"}, {"cat": "Next.js", "q": "Why use Next.js?", "a": "It gives React apps file-based routing, hybrid rendering (SSR/SSG/ISR/CSR per route), built-in image/font optimization, API routes, and a production-ready build pipeline out of the box -- removing a lot of infra decisions a hand-rolled React app would need.", "code": "", "lang": ""}, {"cat": "Next.js", "q": "App Router vs Pages Router.", "a": "App Router (Next 13+, /app) uses React Server Components by default, nested layouts, and streaming; Pages Router (/pages) is the older client-rendered-by-default model with getServerSideProps/getStaticProps for data. App Router is the current recommended default for new projects.", "code": "app/\n  layout.tsx     // shared shell, persists across navigation\n  page.tsx       // route content\n  loading.tsx    // automatic Suspense fallback", "lang": "text"}, {"cat": "Next.js", "q": "Dynamic Routing.", "a": "File or folder names in brackets create parameterized routes; the App Router reads the param via the page's props, and generateStaticParams can pre-render known values at build time.", "code": "// app/blog/[slug]/page.tsx\nexport default function Post({ params }: { params: { slug: string } }) {\n  return <h1>{params.slug}</h1>;\n}", "lang": "jsx"}, {"cat": "Next.js", "q": "Image Optimization.", "a": "next/image automatically serves resized, modern-format (WebP/AVIF) images, lazy-loads offscreen images, and requires width/height (or fill) to prevent layout shift -- all without a manual image pipeline.", "code": "import Image from 'next/image';\n<Image src=\"/hero.jpg\" width={800} height={400} alt=\"Hero\" priority />", "lang": "jsx"}, {"cat": "Next.js", "q": "Middleware.", "a": "Code that runs on the Edge before a request completes routing -- used for auth checks, redirects, A/B test bucketing, or header rewriting, without needing a full page render.", "code": "// middleware.ts\nexport function middleware(req) {\n  const token = req.cookies.get('token');\n  if (!token) return NextResponse.redirect(new URL('/login', req.url));\n}\nexport const config = { matcher: '/dashboard/:path*' };", "lang": "javascript"}, {"cat": "Next.js", "q": "API Routes.", "a": "Route handlers (app/api/.../route.ts) let you build backend endpoints inside the same Next.js project, colocated with the frontend -- useful for BFF patterns, webhooks, or proxying third-party APIs.", "code": "// app/api/users/route.ts\nexport async function GET() {\n  const users = await db.user.findMany();\n  return Response.json(users);\n}", "lang": "javascript"}, {"cat": "Next.js", "q": "SEO optimization.", "a": "Use the Metadata API for title/description/OG tags, server-render or statically generate content-heavy pages so crawlers see real HTML, generate a sitemap.xml and robots.txt, and optimize Core Web Vitals since they affect ranking.", "code": "export const metadata = {\n  title: 'Product | NorthLadder',\n  description: 'Buy the best product',\n  openGraph: { images: ['/og.png'] },\n};", "lang": "javascript"}, {"cat": "Next.js", "q": "Lazy loading.", "a": "Defer loading non-critical code or assets until they're needed, shrinking the initial JS bundle -- via next/dynamic for components and next/image's built-in lazy loading for offscreen images.", "code": "import dynamic from 'next/dynamic';\nconst Chart = dynamic(() => import('./Chart'), { ssr: false, loading: () => <Spinner /> });", "lang": "jsx"}, {"cat": "Next.js", "q": "Route Prefetching.", "a": "Next.js automatically prefetches linked routes in the background when a <Link> enters the viewport, so navigation feels instant since code and data are often already cached by click time.", "code": "<Link href=\"/dashboard\" prefetch={true}>Dashboard</Link> // default true in production", "lang": "jsx"}, {"cat": "Next.js", "q": "Edge Runtime.", "a": "A lightweight JS runtime (not full Node.js) that runs your route/middleware on CDN edge locations close to the user for lower latency -- trades off some Node APIs for speed and global distribution.", "code": "export const runtime = 'edge'; // opt a route handler into the Edge Runtime", "lang": "javascript"}, {"cat": "Next.js", "q": "Metadata API.", "a": "A typed, file- or export-based way (metadata object or generateMetadata function) to define per-route <head> content -- title, description, Open Graph, icons -- replacing manual <Head> management from the Pages Router.", "code": "export async function generateMetadata({ params }) {\n  const product = await getProduct(params.id);\n  return { title: product.name };\n}", "lang": "javascript"}, {"cat": "Next.js", "q": "Streaming UI.", "a": "With Server Components, Next.js can send HTML in chunks as each part becomes ready (via Suspense boundaries) instead of waiting for the whole page -- so a fast header can render immediately while a slow data widget streams in later.", "code": "<Suspense fallback={<Skeleton />}>\n  <SlowRecommendations /> {/* streams in once its data resolves */}\n</Suspense>", "lang": "jsx"}, {"cat": "TypeScript", "q": "Interface vs Type.", "a": "Both describe object shapes. Interfaces can be re-opened and merged (declaration merging) and are generally preferred for public object/class APIs; type aliases can represent unions, tuples, and mapped types that interfaces cannot.", "code": "interface User { name: string }\ninterface User { age: number } // merges -- User now has both fields\n\ntype Status = 'idle' | 'loading' | 'error'; // interface can't express a union", "lang": "typescript"}, {"cat": "TypeScript", "q": "Generics.", "a": "Generics let a function, type, or class work over a range of types while preserving the specific type used at each call site, instead of using 'any' and losing type safety.", "code": "function firstOf<T>(arr: T[]): T | undefined {\n  return arr[0];\n}\nfirstOf<number>([1, 2, 3]); // number | undefined, inferred without the explicit <number>", "lang": "typescript"}, {"cat": "TypeScript", "q": "Utility Types.", "a": "Built-in generic helpers that transform existing types: Partial<T> makes all props optional, Pick<T,K>/Omit<T,K> select or exclude keys, Readonly<T> locks properties, Record<K,V> builds an object type from key/value types.", "code": "interface User { id: string; name: string; email: string }\ntype UserPreview = Pick<User, 'id' | 'name'>;\ntype UserUpdate = Partial<Omit<User, 'id'>>;", "lang": "typescript"}, {"cat": "TypeScript", "q": "keyof.", "a": "The keyof operator produces a union type of an object type's keys, useful for writing functions that safely index into an object by a valid key.", "code": "interface User { id: string; name: string }\ntype UserKey = keyof User; // 'id' | 'name'\nfunction getProp<T, K extends keyof T>(obj: T, key: K): T[K] {\n  return obj[key];\n}", "lang": "typescript"}, {"cat": "TypeScript", "q": "Mapped Types.", "a": "Mapped types generate a new type by transforming each property of an existing type via a { [K in keyof T]: ... } syntax -- the mechanism behind Partial, Readonly, and custom transforms.", "code": "type Nullable<T> = { [K in keyof T]: T[K] | null };\ninterface Form { name: string; age: number }\ntype NullableForm = Nullable<Form>; // { name: string|null; age: number|null }", "lang": "typescript"}, {"cat": "TypeScript", "q": "Union vs Intersection.", "a": "A union (A | B) means a value can be either type (widens possibilities). An intersection (A & B) combines all members of both into one type that must satisfy both simultaneously (narrows/combines).", "code": "type Cat = { meow(): void };\ntype Dog = { bark(): void };\ntype Pet = Cat | Dog;      // has meow OR bark\ntype CatDog = Cat & Dog;   // must have both meow AND bark", "lang": "typescript"}, {"cat": "TypeScript", "q": "Optional chaining.", "a": "The ?. operator short-circuits to undefined instead of throwing when accessing a property on null/undefined, avoiding verbose manual null checks through nested paths.", "code": "const city = user?.address?.city ?? 'Unknown'; // safely reads nested optional properties", "lang": "typescript"}, {"cat": "TypeScript", "q": "Type narrowing.", "a": "TypeScript refines a broader type to a more specific one within a code branch based on runtime checks like typeof, instanceof, in, or custom type guards, so the narrower type's members become safely accessible.", "code": "function printLength(val: string | string[]) {\n  if (typeof val === 'string') {\n    console.log(val.length); // narrowed to string here\n  } else {\n    console.log(val.length); // narrowed to string[] here\n  }\n}", "lang": "typescript"}, {"cat": "TypeScript", "q": "Never vs Unknown.", "a": "'unknown' is a type-safe version of 'any' -- accepts anything but requires narrowing before use. 'never' represents a value that can never occur, used for exhaustiveness checks and functions that always throw or infinite-loop.", "code": "function assertUnreachable(x: never): never {\n  throw new Error('Unexpected value: ' + x); // catches missed switch cases at compile time\n}\nfunction parse(input: unknown) {\n  if (typeof input === 'string') return input.trim(); // must narrow before use\n}", "lang": "typescript"}, {"cat": "TypeScript", "q": "Type-safe APIs.", "a": "Define request/response shapes as types (or generate them from an OpenAPI/GraphQL schema), wrap fetch calls in a typed client, and use generics so callers get compile-time safety and autocomplete instead of 'any' responses.", "code": "async function apiGet<T>(url: string): Promise<T> {\n  const res = await fetch(url);\n  return res.json() as Promise<T>;\n}\nconst user = await apiGet<User>('/api/user/1'); // fully typed 'user'", "lang": "typescript"}, {"cat": "Frontend Architecture", "q": "Describe your frontend architecture.", "a": "Talk in layers: feature-based folder structure, a shared UI/design-system package, a data layer (React Query) separated from presentation, typed API contracts, and clear boundaries so features don't reach into each other's internals.", "code": "src/\n  features/checkout/{components,hooks,api}\n  features/profile/{components,hooks,api}\n  shared/ui/          # design system\n  shared/lib/          # generic utilities", "lang": ""}, {"cat": "Frontend Architecture", "q": "What is Atomic Design?", "a": "A methodology structuring UI into atoms (buttons, inputs), molecules (a labeled input = atoms combined), organisms (a full form = molecules combined), templates (page layout skeletons), and pages (templates with real content).", "code": "atoms/Button.tsx -> molecules/SearchBar.tsx -> organisms/Header.tsx -> templates/PageLayout.tsx -> pages/HomePage.tsx", "lang": ""}, {"cat": "Frontend Architecture", "q": "Component-driven development.", "a": "Build UI bottom-up: develop and test components in isolation (e.g. in Storybook) before wiring them into pages, so components are proven reusable and visually verified before integration risk is added.", "code": "// Button.stories.tsx\nexport const Primary = () => <Button variant=\"primary\">Click me</Button>;\nexport const Disabled = () => <Button disabled>Click me</Button>;", "lang": "jsx"}, {"cat": "Frontend Architecture", "q": "Module Federation.", "a": "A Webpack (5+) capability letting separately built and deployed apps share code and expose/consume components at runtime, without a shared build step -- a common technical implementation for micro-frontends.", "code": "// host app webpack config\nnew ModuleFederationPlugin({\n  remotes: { checkout: 'checkout@https://cdn/checkout/remoteEntry.js' },\n});", "lang": "javascript"}, {"cat": "Frontend Architecture", "q": "Micro Frontends.", "a": "Splitting a large frontend into independently built, tested, and deployed pieces owned by separate teams, composed together at runtime or build time -- trades some duplicated tooling/overhead for team autonomy and independent release cycles.", "code": "", "lang": ""}, {"cat": "Frontend Architecture", "q": "Monorepo vs Polyrepo.", "a": "A monorepo keeps multiple packages/apps in one repository (easy cross-package refactors, shared tooling, atomic commits across packages) vs polyrepo's separate repos per package (stronger isolation, independent versioning, more release overhead). Tools like Turborepo/Nx make monorepos practical at scale.", "code": "apps/web  apps/admin\npackages/ui  packages/config  packages/utils", "lang": ""}, {"cat": "Frontend Architecture", "q": "Feature-based architecture.", "a": "Organize code by business feature (checkout/, profile/) rather than by technical type (all components/ together, all hooks/ together) -- so everything needed to understand or change a feature lives in one place.", "code": "features/checkout/\n  CheckoutForm.tsx\n  useCheckout.ts\n  checkoutApi.ts\n  checkout.test.tsx", "lang": ""}, {"cat": "Frontend Architecture", "q": "Design Tokens.", "a": "Named, platform-agnostic values (color-primary, spacing-4, font-size-lg) that centralize design decisions so they can be shared across web/iOS/Android and changed in one place instead of hardcoded throughout components.", "code": "// tokens.json -> generates CSS variables\n:root {\n  --color-primary: #ffffff;\n  --spacing-4: 16px;\n}", "lang": "css"}, {"cat": "Frontend Architecture", "q": "Storybook.", "a": "A tool for developing and documenting UI components in isolation with different states/props (stories), enabling visual review, accessibility checks, and visual regression testing without needing the full app running.", "code": "export default { component: Button };\nexport const AllVariants = () => (\n  <>\n    <Button variant=\"primary\">Primary</Button>\n    <Button variant=\"ghost\">Ghost</Button>\n  </>\n);", "lang": "jsx"}, {"cat": "Frontend Architecture", "q": "Folder structure.", "a": "Prefer feature-based grouping over type-based for anything beyond a small app, keep a 'shared' layer for truly cross-cutting code, and avoid deep nesting that makes imports hard to trace.", "code": "src/\n  app/          # routing, providers\n  features/     # feature-based modules\n  shared/       # ui, lib, hooks used everywhere", "lang": ""}, {"cat": "Frontend Architecture", "q": "How would you design a scalable UI architecture?", "a": "Separate presentation from data-fetching, enforce a shared design system as the only source of UI primitives, define clear feature boundaries with public APIs (index.ts exports), type all contracts, and enforce lint rules against cross-feature imports.", "code": "// eslint boundary rule example concept\n// features/checkout can't import from features/profile/internal/*", "lang": ""}, {"cat": "Design System", "q": "Have you built a Design System?", "a": "Answer with scope: how many components, how many consuming teams, and one concrete adoption metric or challenge you solved.", "code": "Example answer: \"I led a design system with 35 components used by 6 product teams, built on design tokens shared between Figma and code via a token pipeline, which cut new-feature UI build time by roughly a third.\"", "lang": ""}, {"cat": "Design System", "q": "What makes a good UI component?", "a": "Single responsibility, a small predictable prop API, sensible defaults, accessible by default (keyboard/ARIA), visually consistent via tokens rather than hardcoded values, and documented with clear usage examples.", "code": "<Button variant=\"primary\" size=\"md\" isLoading={false} disabled={false}>\n  Save\n</Button> // predictable API, sensible defaults, no hidden required props", "lang": ""}, {"cat": "Design System", "q": "Button variants.", "a": "Typically primary (main CTA), secondary/ghost (lower emphasis), destructive (dangerous actions), and disabled/loading states -- each mapped to token-based colors so a single theme change updates every button.", "code": ".btn-primary { background: var(--color-fg); color: var(--color-bg); }\n.btn-ghost { background: transparent; border: 1px solid var(--color-fg); }", "lang": "css"}, {"cat": "Design System", "q": "Typography.", "a": "Define a type scale (e.g. modular scale with a ratio like 1.25), limit to 2 font families (display + body), and set line-height/letter-spacing per size step -- expose as tokens, not ad-hoc font-size values in components.", "code": "--font-size-sm: 14px; --font-size-md: 16px; --font-size-lg: 20px; --font-size-xl: 28px;", "lang": "css"}, {"cat": "Design System", "q": "Colors.", "a": "Define semantic tokens (color-bg, color-fg, color-danger) that map to raw palette values, so components reference semantics, not raw hex -- enabling theming (light/dark) by only swapping the token mapping.", "code": ":root { --color-bg: #000; --color-fg: #fff; }\n[data-theme='light'] { --color-bg: #fff; --color-fg: #000; }", "lang": "css"}, {"cat": "Design System", "q": "Spacing.", "a": "Use a consistent spacing scale (e.g. 4px base: 4/8/12/16/24/32) as tokens rather than arbitrary pixel values, so layouts stay visually rhythmic and easy to reason about.", "code": "--space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;", "lang": "css"}, {"cat": "Design System", "q": "Icons.", "a": "Use a single consistent icon set (same stroke width/grid) delivered as an SVG sprite or tree-shakeable component library, sized via tokens, with aria-hidden on decorative icons and accessible labels on interactive ones.", "code": "<Icon name=\"trash\" size={16} aria-hidden=\"true\" /> // decorative; pair with visible/aria-label text for interactive use", "lang": "jsx"}, {"cat": "Design System", "q": "Tokens.", "a": "The atomic values (color, spacing, radius, shadow, type) that back every component -- ideally defined once (e.g. in Figma or a JSON source of truth) and generated into CSS variables/JS constants for code, keeping design and code in sync.", "code": "// tokens generated to multiple platforms from one JSON source\n{ \"color.bg\": \"#000000\", \"space.4\": \"16px\" }", "lang": ""}, {"cat": "Design System", "q": "Component documentation.", "a": "Every component needs a live example (Storybook), a prop/API table, usage do's and don'ts, and accessibility notes -- documentation that's runnable, not just a static markdown description that can drift from the code.", "code": "", "lang": ""}, {"cat": "Design System", "q": "Versioning strategy.", "a": "Publish the design system as a semver-versioned package (patch = bugfix, minor = new component/non-breaking prop, major = breaking API change) with a changelog, so consuming apps can upgrade deliberately.", "code": "npm install @northladder/ui@^2.3.0 // consuming app pins a compatible range, upgrades deliberately", "lang": ""}, {"cat": "Design System", "q": "How would you encourage adoption across teams?", "a": "Make the system the path of least resistance: solve real pain points first, provide Figma-to-code parity, run office hours/onboarding sessions, and track adoption metrics to show ROI to leadership.", "code": "Example: I tracked % of UI built from design-system components per team dashboard, which turned adoption into a visible, celebrated metric rather than an unenforced guideline.", "lang": ""}, {"cat": "UI & UX", "q": "Mobile-first vs Desktop-first.", "a": "Mobile-first starts CSS for the smallest viewport and adds complexity via min-width media queries as screens grow -- generally leads to leaner, more focused mobile experiences and forces prioritization. Desktop-first does the reverse and often ships bloated mobile UX as an afterthought.", "code": "/* mobile-first */\n.card { padding: 12px; }\n@media (min-width: 768px) { .card { padding: 24px; } }", "lang": "css"}, {"cat": "UI & UX", "q": "Responsive Design.", "a": "Layouts adapt fluidly to viewport size using relative units, flexible grids, media/container queries, and responsive images -- rather than fixed pixel layouts that break on other screen sizes.", "code": "@container (min-width: 400px) {\n  .card { grid-template-columns: 1fr 1fr; }\n}", "lang": "css"}, {"cat": "UI & UX", "q": "CSS Grid vs Flexbox.", "a": "Flexbox is one-dimensional (row OR column) and best for distributing items along a single axis (navbars, button groups). Grid is two-dimensional (rows AND columns) and best for overall page/section layout where both axes matter.", "code": ".navbar { display: flex; justify-content: space-between; } /* 1D */\n.page { display: grid; grid-template-columns: 240px 1fr; }   /* 2D */", "lang": "css"}, {"cat": "UI & UX", "q": "Tailwind vs Styled Components.", "a": "Tailwind uses utility classes directly in markup (fast iteration, no naming, small production CSS via purging, but can clutter JSX). Styled Components writes actual CSS-in-JS scoped to a component (co-located styles, dynamic props-based styling, but runtime cost and larger bundle).", "code": "// Tailwind\n<button className=\"px-4 py-2 bg-black text-white rounded\">Save</button>\n// Styled Components\nconst Btn = styled.button`padding: 8px 16px; background: black; color: white;`;", "lang": "jsx"}, {"cat": "UI & UX", "q": "CSS Modules.", "a": "CSS files scoped automatically per-component at build time (class names get hashed uniquely), giving true style isolation without a naming convention like BEM and without CSS-in-JS runtime cost.", "code": "/* Button.module.css */\n.button { padding: 8px 16px; }\n\n// Button.tsx\nimport styles from './Button.module.css';\n<button className={styles.button} />", "lang": "css"}, {"cat": "UI & UX", "q": "Accessibility.", "a": "Building UI usable by people with disabilities: semantic HTML, sufficient color contrast, full keyboard operability, proper ARIA only where semantics fall short, and screen-reader-friendly labeling -- both a legal requirement (ADA/WCAG) and good UX for everyone.", "code": "<button aria-pressed={isActive} onClick={toggle}>\n  {isActive ? 'Following' : 'Follow'}\n</button> // native <button>, no ARIA hacks needed for basic toggle semantics", "lang": "jsx"}, {"cat": "UI & UX", "q": "WCAG 2.1 AA.", "a": "The mid-tier Web Content Accessibility Guidelines compliance level most organizations target legally: 4.5:1 text contrast minimum (3:1 for large text), full keyboard operability, visible focus indicators, resizable text to 200%, and meaningful alt text/labels.", "code": "", "lang": ""}, {"cat": "UI & UX", "q": "Keyboard Navigation.", "a": "Every interactive element must be reachable and operable via Tab/Shift+Tab/Enter/Space/Arrow keys alone, in a logical order matching visual layout, with no keyboard traps.", "code": "<div role=\"button\" tabIndex={0}\n  onKeyDown={(e) => (e.key === 'Enter' || e.key === ' ') && onClick()}\n  onClick={onClick}>\n  Custom Button\n</div> // needed only when you can't use a native <button>", "lang": "jsx"}, {"cat": "UI & UX", "q": "ARIA.", "a": "Accessible Rich Internet Applications attributes fill semantic gaps HTML doesn't cover (custom widgets like tabs, comboboxes) -- but the first rule of ARIA is: don't use ARIA if a native HTML element already provides the semantics you need.", "code": "<div role=\"tablist\">\n  <button role=\"tab\" aria-selected=\"true\" id=\"tab1\">Tab 1</button>\n</div>", "lang": "jsx"}, {"cat": "UI & UX", "q": "Color Contrast.", "a": "Text must meet a minimum contrast ratio against its background (4.5:1 normal text, 3:1 large text/UI components at WCAG AA) so low-vision users can read it -- checked with tools like the WebAIM contrast checker.", "code": "/* pure black on white or white on black = 21:1, far exceeds AA */\ncolor: #ffffff; background: #000000;", "lang": "css"}, {"cat": "UI & UX", "q": "Focus Management.", "a": "Ensure focus moves logically for the user, especially in dynamic UI: move focus into a modal on open and return it to the trigger on close, and never remove visible focus outlines without a visible replacement.", "code": "useEffect(() => {\n  if (isOpen) dialogRef.current?.focus();\n  return () => triggerRef.current?.focus(); // restore focus on close\n}, [isOpen]);", "lang": "jsx"}, {"cat": "Performance", "q": "Largest React performance issue you solved.", "a": "Frame it as: symptom -> profiling method -> root cause -> fix -> measured result.", "code": "Example: a dashboard re-rendered its entire 500-row table on every keystroke in an unrelated filter input. React DevTools Profiler showed unmemoized rows re-rendering; wrapping Row in React.memo and moving the filter input's state out of the shared parent cut render time from 400ms to 30ms.", "lang": ""}, {"cat": "Performance", "q": "React.memo.", "a": "A higher-order component that skips re-rendering a component if its props are shallow-equal to the previous render -- useful for expensive leaf components in lists, but adds overhead if the component is cheap or props change every render anyway.", "code": "const Row = React.memo(function Row({ item }) {\n  return <tr><td>{item.name}</td></tr>;\n}); // skips re-render if 'item' reference is unchanged", "lang": "jsx"}, {"cat": "Performance", "q": "Lazy Loading.", "a": "Defer loading of code or assets until actually needed (route-level code splitting, below-the-fold images) to shrink initial bundle/payload size and speed up first render.", "code": "const Settings = React.lazy(() => import('./Settings'));", "lang": "jsx"}, {"cat": "Performance", "q": "Code Splitting.", "a": "Breaking a single large JS bundle into smaller chunks loaded on demand (per route or per feature) via dynamic import(), so users only download the code the current page actually needs.", "code": "// route-based split, handled automatically by Next.js per page\nconst Chart = dynamic(() => import('./Chart'));", "lang": "javascript"}, {"cat": "Performance", "q": "Bundle Optimization.", "a": "Analyze bundle composition (e.g. with webpack-bundle-analyzer), remove unused/duplicate dependencies, prefer smaller alternatives, tree-shake unused exports, and code-split heavy rarely-used features.", "code": "npx @next/bundle-analyzer  # visualize what's actually shipped to the client", "lang": "bash"}, {"cat": "Performance", "q": "Lighthouse.", "a": "A Chrome dev tool auditing pages for performance, accessibility, best practices, and SEO, producing a 0-100 score per category plus Core Web Vitals metrics and specific actionable suggestions.", "code": "npx lighthouse https://example.com --view", "lang": "bash"}, {"cat": "Performance", "q": "Tree Shaking.", "a": "A build-time process (via ES module static analysis) that removes exported code that's never imported anywhere, shrinking the final bundle -- requires using ES modules (import/export) rather than CommonJS for the analysis to work.", "code": "// only 'debounce' is imported, so tree-shaking drops the rest of the library\nimport { debounce } from 'lodash-es';", "lang": "javascript"}, {"cat": "Performance", "q": "Image Optimization.", "a": "Serve correctly sized, modern-format (WebP/AVIF) images, lazy-load offscreen images, and set explicit dimensions to avoid layout shift -- next/image handles most of this automatically.", "code": "<Image src=\"/photo.jpg\" width={600} height={400} alt=\"\" sizes=\"(max-width: 768px) 100vw, 600px\" />", "lang": "jsx"}, {"cat": "Performance", "q": "Virtualization.", "a": "Render only the DOM nodes currently visible in a long list/table (plus a small buffer), recycling nodes as the user scrolls -- keeps DOM node count constant regardless of list size, critical for lists of thousands of rows.", "code": "import { FixedSizeList } from 'react-window';\n<FixedSizeList height={600} itemCount={10000} itemSize={35} width=\"100%\">\n  {({ index, style }) => <div style={style}>Row {index}</div>}\n</FixedSizeList>", "lang": "jsx"}, {"cat": "Performance", "q": "Debouncing.", "a": "Delay invoking a function until a burst of calls has paused for a set duration -- used for search inputs to avoid firing an API call on every keystroke.", "code": "const debouncedSearch = useMemo(() => debounce(fetchResults, 300), []);", "lang": "javascript"}, {"cat": "Performance", "q": "Throttling.", "a": "Limit a function to run at most once per fixed time window, regardless of how many times it's triggered -- used for scroll/resize handlers where you need periodic updates, not a final-value-only pattern.", "code": "window.addEventListener('scroll', throttle(updateScrollPosition, 100));", "lang": "javascript"}, {"cat": "Performance", "q": "Memoization.", "a": "Caching the result of an expensive computation keyed by its inputs, so repeated calls with the same inputs return the cached result instead of recomputing -- in React, useMemo/React.memo/useCallback are the built-in tools.", "code": "const total = useMemo(() => items.reduce((s, i) => s + i.price, 0), [items]);", "lang": "jsx"}, {"cat": "Performance", "q": "Performance profiling.", "a": "Use the React DevTools Profiler to find components re-rendering unnecessarily or rendering slowly, and Chrome DevTools Performance tab to find long JS tasks, layout thrashing, or excessive paint work -- always measure before optimizing.", "code": "// wrap a suspect subtree to isolate its render cost\n<Profiler id=\"Dashboard\" onRender={(id, phase, duration) => console.log(duration)}>\n  <Dashboard />\n</Profiler>", "lang": "jsx"}, {"cat": "Testing", "q": "Jest.", "a": "A JS test runner/framework with built-in assertions, mocking, snapshot testing, and coverage reporting -- the most common runner for unit and integration tests in React apps (Vitest is a common faster alternative today).", "code": "test('adds two numbers', () => {\n  expect(sum(2, 3)).toBe(5);\n});", "lang": "javascript"}, {"cat": "Testing", "q": "React Testing Library.", "a": "A testing utility that encourages testing components the way a user interacts with them (by visible text/role, not internal implementation details), leading to tests that survive refactors better than shallow-rendering approaches.", "code": "render(<LoginForm />);\nawait userEvent.type(screen.getByLabelText('Email'), 'a@b.com');\nawait userEvent.click(screen.getByRole('button', { name: /log in/i }));\nexpect(await screen.findByText('Welcome')).toBeInTheDocument();", "lang": "javascript"}, {"cat": "Testing", "q": "Cypress.", "a": "An end-to-end testing tool that runs tests inside the actual browser with time-travel debugging, real network control, and automatic waiting -- strong developer experience for E2E and component testing.", "code": "cy.visit('/login');\ncy.get('[data-cy=email]').type('a@b.com');\ncy.get('[data-cy=submit]').click();\ncy.contains('Welcome').should('be.visible');", "lang": "javascript"}, {"cat": "Testing", "q": "Playwright.", "a": "A cross-browser (Chromium/Firefox/WebKit) E2E testing framework with strong parallelization, auto-waiting, and network interception -- increasingly preferred over Cypress for true multi-browser coverage and CI speed.", "code": "await page.goto('/login');\nawait page.fill('#email', 'a@b.com');\nawait page.click('button[type=submit]');\nawait expect(page.getByText('Welcome')).toBeVisible();", "lang": "javascript"}, {"cat": "Testing", "q": "Snapshot Testing.", "a": "Captures a component's rendered output and compares it against a saved reference on future runs, flagging unexpected changes -- useful for catching accidental UI regressions, but low-value if snapshots are huge or blindly updated without review.", "code": "test('renders correctly', () => {\n  const { asFragment } = render(<Card title=\"Hi\" />);\n  expect(asFragment()).toMatchSnapshot();\n});", "lang": "javascript"}, {"cat": "Testing", "q": "Integration Testing.", "a": "Tests multiple units working together (a form component plus its validation hook plus a mocked API call) to verify they integrate correctly -- sits between fast isolated unit tests and slow full E2E tests.", "code": "test('submits form and shows success', async () => {\n  server.use(rest.post('/api/signup', (req, res, ctx) => res(ctx.json({ ok: true }))));\n  render(<SignupForm />);\n  // fill form and submit, then assert success message appears\n});", "lang": "javascript"}, {"cat": "Testing", "q": "E2E Testing.", "a": "Tests the full application stack (real or realistic backend, real browser) through actual user flows end-to-end -- highest confidence, slowest and most brittle, so reserved for critical paths like checkout or auth, not exhaustive coverage.", "code": "test('user can complete checkout', async ({ page }) => {\n  await page.goto('/cart');\n  await page.click('text=Checkout');\n  await expect(page).toHaveURL('/order-confirmation');\n});", "lang": "javascript"}, {"cat": "Testing", "q": "Mock APIs example.", "a": "Intercept network requests in tests so they return controlled fixture data instead of hitting a real backend -- keeps tests fast, deterministic, and independent of external services. MSW (Mock Service Worker) is the common modern tool.", "code": "const server = setupServer(\n  rest.get('/api/user', (req, res, ctx) => res(ctx.json({ name: 'Sam' })))\n);\nbeforeAll(() => server.listen());", "lang": "javascript"}, {"cat": "Testing", "q": "Visual Regression Testing.", "a": "Captures screenshots of components/pages and diffs them pixel-by-pixel against a baseline on each run, flagging unintended visual changes -- tools like Chromatic (built on Storybook) or Percy automate this in CI.", "code": "// Chromatic runs this automatically against every Storybook story on each PR\n// flags any pixel diff for human review before merge", "lang": ""}, {"cat": "Testing", "q": "Button click test case.", "a": "Test the observable behavior a user cares about (does clicking call the handler / update visible state), not internal implementation like state variable names.", "code": "test('calls onClick when clicked', async () => {\n  const onClick = jest.fn();\n  render(<Button onClick={onClick}>Save</Button>);\n  await userEvent.click(screen.getByRole('button', { name: 'Save' }));\n  expect(onClick).toHaveBeenCalledTimes(1);\n});", "lang": "javascript"}, {"cat": "CI/CD", "q": "Describe your frontend pipeline.", "a": "Walk through stages: lint/typecheck -> unit tests -> build -> E2E on a preview deploy -> deploy to staging -> manual or automatic promotion to production, with each stage gating the next.", "code": "PR opened -> lint + typecheck + unit tests (parallel) -> build + preview deploy -> E2E against preview -> merge -> auto-deploy staging -> manual approval -> production", "lang": ""}, {"cat": "CI/CD", "q": "GitHub Actions.", "a": "A CI/CD platform built into GitHub that runs workflows (YAML-defined jobs) on events like push/PR -- commonly used for lint/test/build/deploy pipelines with a large marketplace of reusable actions.", "code": "on: [pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci\n      - run: npm test", "lang": "yaml"}, {"cat": "CI/CD", "q": "Jenkins.", "a": "A self-hosted, highly extensible CI/CD server configured via Jenkinsfiles (pipeline-as-code), commonly used in enterprises needing on-prem control or complex custom pipeline logic beyond what hosted CI offers.", "code": "pipeline {\n  agent any\n  stages {\n    stage('Test') { steps { sh 'npm test' } }\n    stage('Deploy') { steps { sh 'npm run deploy' } }\n  }\n}", "lang": "groovy"}, {"cat": "CI/CD", "q": "Build optimization.", "a": "Cache dependencies and build artifacts between CI runs, parallelize independent jobs (lint/test/typecheck run concurrently, not sequentially), and use incremental builds (Turborepo/Nx) in a monorepo to only rebuild what changed.", "code": "- uses: actions/cache@v4\n  with:\n    path: node_modules\n    key: npm-${{ hashFiles('package-lock.json') }}", "lang": "yaml"}, {"cat": "CI/CD", "q": "Deployment strategy.", "a": "Options include rolling (gradually replace old instances), blue-green (switch traffic instantly between two full environments), and canary (route a small % of traffic to the new version first) -- choice depends on risk tolerance and rollback speed needed.", "code": "", "lang": ""}, {"cat": "CI/CD", "q": "Rollback strategy.", "a": "Keep the previous build artifact deployable at all times (immutable deploys), automate rollback triggers on error-rate/health-check failure, and prefer feature flags over full redeploys for fast, low-risk reversal.", "code": "// most platforms (Vercel/Netlify) let you instantly re-promote a prior immutable deployment\nvercel rollback <previous-deployment-url>", "lang": "bash"}, {"cat": "CI/CD", "q": "Feature Flags.", "a": "Toggle functionality on/off at runtime without a redeploy -- enables trunk-based development (merge incomplete work behind a flag), gradual rollouts, and instant kill-switches if a feature misbehaves in production.", "code": "if (flags.isEnabled('new-checkout')) {\n  return <NewCheckout />;\n}\nreturn <LegacyCheckout />;", "lang": "jsx"}, {"cat": "CI/CD", "q": "Remote Config.", "a": "Externalized configuration values (thresholds, copy, experiment variants) that can be changed remotely without a code deploy -- often layered with feature flags for A/B testing and per-segment behavior.", "code": "", "lang": ""}, {"cat": "CI/CD", "q": "Blue-Green Deployment.", "a": "Run two identical production environments ('blue' live, 'green' idle); deploy the new version to green, verify it, then switch the router/load balancer to send all traffic to green -- near-zero downtime and instant rollback by switching back to blue.", "code": "", "lang": ""}, {"cat": "System Design", "q": "Design an e-commerce frontend.", "a": "Cover: catalog browsing (SSR/ISR for SEO), product detail with client-side cart interactions, cart state (persisted client-side + synced to server for logged-in users), checkout as an isolated flow with strict validation, and payment via a hosted/tokenized third-party widget for PCI compliance.", "code": "Pages: /  /category/[slug]  /product/[id]  /cart  /checkout\nState: server cart via API + optimistic local updates, React Query for catalog data", "lang": ""}, {"cat": "System Design", "q": "Design a reusable component library.", "a": "Token-driven styling, a small consistent prop API across components, per-component accessibility and tests, Storybook documentation, and semver-versioned publishing so teams can adopt updates deliberately.", "code": "", "lang": ""}, {"cat": "System Design", "q": "Design a dashboard supporting 100k users.", "a": "Virtualize large data tables, paginate/cursor-fetch API data rather than loading everything, cache aggressively with React Query (staleTime/background refetch), lazy-load rarely-viewed widgets/tabs, and use websockets or polling only for genuinely live data, not everything.", "code": "const { data } = useQuery({\n  queryKey: ['metrics', filters],\n  queryFn: () => fetchMetrics(filters),\n  staleTime: 30_000, // avoid refetch storms across 100k concurrent users\n});", "lang": "jsx"}, {"cat": "System Design", "q": "Design a scalable Design System.", "a": "Single source-of-truth tokens generated to multiple platforms, framework-agnostic primitives where possible, strict versioning, automated visual regression tests in CI, and a governance process (an RFC-style proposal flow) for adding new components.", "code": "", "lang": ""}, {"cat": "System Design", "q": "How would you architect a multi-brand application?", "a": "Keep components brand-agnostic and drive all visual differences through swappable design-token themes (per-brand CSS variable sets), with brand-specific copy/assets loaded via config rather than forked components.", "code": "[data-brand='acme'] { --color-primary: #ffffff; }\n[data-brand='globex'] { --color-primary: #f0f0f0; }", "lang": "css"}, {"cat": "System Design", "q": "Micro Frontend architecture.", "a": "Decompose the app by domain (checkout, catalog, account), each owned and deployed independently by a team, composed at the shell/router level (via Module Federation, iframes, or edge-side includes) -- with a shared design system to keep UX consistent despite independent codebases.", "code": "", "lang": ""}, {"cat": "System Design", "q": "Build a notification system.", "a": "Frontend: a global notification store (Context/Zustand) with a queue, a WebSocket or SSE connection for real-time push falling back to polling, toast/banner components for transient alerts, and a persistent notification center for history with read/unread state.", "code": "const useNotifications = create((set) => ({\n  items: [],\n  push: (n) => set((s) => ({ items: [n, ...s.items] })),\n}));", "lang": "javascript"}, {"cat": "System Design", "q": "Offline-first web app.", "a": "Use a Service Worker to cache app shell and assets, an IndexedDB-backed local data store as the source of truth for UI, sync mutations to the server in the background (with conflict resolution) once connectivity returns, and show clear online/offline UI state.", "code": "self.addEventListener('fetch', (event) => {\n  event.respondWith(\n    caches.match(event.request).then((cached) => cached || fetch(event.request))\n  );\n});", "lang": "javascript"}, {"cat": "System Design", "q": "Progressive Web App.", "a": "A web app that behaves like a native app via a manifest.json (installable, icons, splash screen) and a service worker (offline support, push notifications, background sync) -- gives app-like reach without an app-store install.", "code": "// manifest.json\n{ \"name\": \"NorthLadder\", \"display\": \"standalone\", \"start_url\": \"/\", \"icons\": [...] }", "lang": "json"}, {"cat": "Behavioral", "q": "Tell me about a difficult project.", "a": "Use STAR: Situation, Task, Action, Result. Pick a project with real ambiguity or constraint (unclear requirements, tight deadline, legacy code) and be specific about your individual actions.", "code": "Example: \"Ou

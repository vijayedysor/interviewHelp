r design system had to support 3 brands with 6 weeks' notice before a launch (Situation/Task). I proposed a token-based theming layer instead of forking components, built a proof of concept in 2 days to get buy-in, then led implementation across 12 components (Action). We shipped on time with zero component duplication (Result).\"", "lang": ""}, {"cat": "Behavioral", "q": "Tell me about a conflict with another engineer.", "a": "Focus on how you resolved it professionally and what you learned -- avoid blaming the other person, show you sought to understand their perspective.", "code": "Example: \"A peer and I disagreed on state management for a new module. Instead of arguing further in Slack, I suggested we each spend half a day prototyping our approach against the real requirements, then review together. His approach turned out simpler for our case -- I adopted it, and we agreed to always time-box a spike before big architecture debates going forward.\"", "lang": ""}, {"cat": "Behavioral", "q": "Tell me about a failed release.", "a": "Own the failure honestly, focus on the root cause analysis and the process change that came out of it, not on assigning blame.", "code": "Example: \"We shipped a pricing update that broke checkout for users with saved payment methods -- our staging tests didn't cover that user segment. I ran the postmortem, we added a staging seed script covering all payment-method states, and added a canary release step before full rollout. We haven't had a similar incident since.\"", "lang": ""}, {"cat": "Behavioral", "q": "Tell me about a production bug.", "a": "Show the debugging process (how you narrowed it down), the fix, and the follow-up to prevent recurrence -- demonstrates both technical skill and systems thinking.", "code": "Example: \"Users reported random logouts. I reproduced it, checked network logs, and traced it to a race condition where a token refresh and an API call fired simultaneously, invalidating a valid session. I added a request queue during refresh, and added a regression test simulating concurrent requests.\"", "lang": ""}, {"cat": "Behavioral", "q": "Describe a time you led a technical initiative.", "a": "Show initiative-taking (you identified the problem, not just executed a assigned task), how you got buy-in, and the measurable outcome.", "code": "Example: \"I noticed our bundle size had crept to 2.4MB with no one tracking it. I proposed and led a bundle-budget initiative: added CI checks that fail on budget regressions, and led a cleanup sprint that got us to 1.1MB, improving median load time by 35%.\"", "lang": ""}, {"cat": "Behavioral", "q": "Describe a difficult stakeholder.", "a": "Show empathy for their constraints while holding a clear technical position, and demonstrate you found a path that addressed their underlying need, not just their literal request.", "code": "Example: \"A PM wanted a feature shipped in 3 days that needed 2 weeks technically. Rather than a flat no, I broke it into a scoped MVP we could ship in 3 days plus a follow-up for the rest, which met her actual deadline pressure (a demo) without cutting corners on the full feature.\"", "lang": ""}, {"cat": "Behavioral", "q": "Describe a situation where you changed a technical decision.", "a": "Show intellectual honesty: what new information changed your mind, and that you communicated the change transparently rather than quietly reversing course.", "code": "Example: \"I'd championed GraphQL for a new service, but after a 2-week spike showed our team's REST tooling and monitoring were far more mature, I recommended we stick with REST and wrote up the reasoning so the decision was documented, not just abandoned quietly.\"", "lang": ""}, {"cat": "Behavioral", "q": "Tell us about mentoring someone.", "a": "Give a specific person's growth arc (without naming them if sensitive), your concrete mentoring actions, and the measurable outcome (promotion, ownership gained).", "code": "Example: \"I mentored a junior engineer struggling with code review feedback taking things personally. I started doing paired review sessions live instead of async comments, which built trust; within two quarters he was doing thoughtful reviews for others and was promoted to mid-level.\"", "lang": ""}, {"cat": "Behavioral", "q": "Biggest mistake you've made.", "a": "Choose a real, moderately consequential mistake, own it fully without excessive self-flagellation, and lead with what you changed afterward -- this shows maturity, not risk.", "code": "Example: \"I deployed a database migration directly to production without a staging dry-run, which locked a table for 10 minutes during peak traffic. I now enforce staging dry-runs for all migrations, and added migration duration estimates to our deploy checklist.\"", "lang": ""}, {"cat": "Behavioral", "q": "What would your team say about you?", "a": "Pick 2-3 specific traits backed by evidence (not just adjectives), ideally something you know from actual feedback (a review, a retro comment) rather than assumed.", "code": "Example: \"Probably that I'm direct but fair in code review, and that I protect the team's focus time -- in my last review, two engineers specifically mentioned I shield the team from scope creep mid-sprint.\"", "lang": ""}]</script>

<script>
const DATA = JSON.parse(document.getElementById('qdata').textContent);

// group by category, preserving first-seen order
const catOrder = [];
const byCat = {};
DATA.forEach(d => {
  if(!byCat[d.cat]){ byCat[d.cat] = []; catOrder.push(d.cat); }
  byCat[d.cat].push(d);
});

document.getElementById('statTotal').textContent = DATA.length;
document.getElementById('statCats').textContent = catOrder.length;

let activeCat = 'all';
let query = '';

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q){
  const safe = escapeHtml(text);
  if(!q) return safe;
  try{
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    return safe.replace(re, '<mark>$1</mark>');
  }catch(e){ return safe; }
}

function matches(item, q){
  if(!q) return true;
  const hay = (item.q + ' ' + item.a + ' ' + item.code + ' ' + item.cat).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function renderSidebar(){
  const list = document.getElementById('catList');
  let html = '';
  html += `<button class="cat-btn ${activeCat==='all'?'active':''}" data-cat="all">
              <span>All topics</span><span class="n">${DATA.length}</span>
            </button>`;
  catOrder.forEach(cat => {
    html += `<button class="cat-btn ${activeCat===cat?'active':''}" data-cat="${escapeHtml(cat)}">
                <span>${escapeHtml(cat)}</span><span class="n">${byCat[cat].length}</span>
              </button>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCat = btn.dataset.cat;
      render();
      if(window.innerWidth <= 860){
        document.getElementById('main').scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
  });
}

let openState = {}; // key -> bool

function cardKey(cat, idx){ return cat + '::' + idx; }

function render(){
  renderSidebar();
  const main = document.getElementById('main');
  const q = query.trim();

  let cats = activeCat === 'all' ? catOrder : [activeCat];
  let totalShown = 0;
  let html = '';

  cats.forEach(cat => {
    const items = byCat[cat].filter(it => matches(it, q));
    if(items.length === 0) return;
    totalShown += items.length;
    html += `<div class="cat-group">
      <div class="cat-heading">
        <h2>${escapeHtml(cat)}</h2>
        <span class="count">${items.length} question${items.length===1?'':'s'}</span>
      </div>`;
    items.forEach((it) => {
      const globalIdx = DATA.indexOf(it);
      const key = cardKey(it.cat, globalIdx);
      const isOpen = !!openState[key] || (q.length > 1);
      const hasCode = it.code && it.code.trim().length > 0;
      const looksLikeCode = hasCode && it.lang && it.lang !== '';
      html += `<div class="card ${isOpen?'open':''}" data-key="${key}">
        <button class="card-q" data-key="${key}">
          <span class="qmark">Q</span>
          <span class="qtext">${highlight(it.q, q)}</span>
          <span class="chev">›</span>
        </button>
        <div class="card-body">
          <div class="card-body-inner">
            <p class="answer">${highlight(it.a, q)}</p>
            ${hasCode ? (looksLikeCode
              ? `<div class="example-label">example</div><pre><code>${highlight(it.code, q)}</code></pre>`
              : `<div class="example-label">example</div><div class="plain-example">${highlight(it.code, q)}</div>`)
              : ''}
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  if(totalShown === 0){
    html = `<div class="empty-state">
      <div class="glyph">∅</div>
      <p>No matches for "<span style="color:var(--fg)">${escapeHtml(q)}</span>"</p>
      <p>Try a shorter term, or clear the filter.</p>
    </div>`;
  }

  main.innerHTML = html;

  document.getElementById('resultCount').innerHTML =
    q ? `<b>${totalShown}</b> match${totalShown===1?'':'es'} for "${escapeHtml(q)}"` : '';

  main.querySelectorAll('.card-q').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key;
      const card = main.querySelector(`.card[data-key="${CSS.escape(key)}"]`);
      // read the ACTUAL current visual state (not a stale internal flag,
      // which could be out of sync when a card was auto-opened by search)
      const nowOpen = !card.classList.contains('open');
      card.classList.toggle('open', nowOpen);
      openState[key] = nowOpen;
    });
  });
}

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', (e)=>{
  query = e.target.value;
  render();
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  query = '';
  searchInput.value = '';
  activeCat = 'all';
  render();
  searchInput.focus();
});

document.addEventListener('keydown', (e)=>{
  if(e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
  }
  if(e.key === 'Escape' && document.activeElement === searchInput){
    searchInput.blur();
  }
});

render();
</script>

</body>
</html>
